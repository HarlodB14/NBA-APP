<title>Security — oefenapp</title>

<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --sunk:#EDEBE4;
  --ink:#191C20; --muted:#6B685F; --line:#DEDBD2;
  --accent:#A8742A; --accent-soft:#F0E4D0;
  --pub:#2A6F97; --priv:#8E3B76;
  --ok:#2E7D5B; --ok-soft:#DFF0E6;
  --bad:#B23A48; --bad-soft:#F8E1E3;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:Georgia,"Iowan Old Style",Palatino,serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101319; --surface:#171B22; --sunk:#1D222B;
    --ink:#E9E7E1; --muted:#9A968C; --line:#2A303A;
    --accent:#D8A250; --accent-soft:#33291A;
    --pub:#5FA8D3; --priv:#C77BB0;
    --ok:#5FBF92; --ok-soft:#16281F;
    --bad:#E8737F; --bad-soft:#2C1A1D;
  }
}
:root[data-theme="dark"]{
  --bg:#101319; --surface:#171B22; --sunk:#1D222B;
  --ink:#E9E7E1; --muted:#9A968C; --line:#2A303A;
  --accent:#D8A250; --accent-soft:#33291A;
  --pub:#5FA8D3; --priv:#C77BB0;
  --ok:#5FBF92; --ok-soft:#16281F;
  --bad:#E8737F; --bad-soft:#2C1A1D;
}
:root[data-theme="light"]{
  --bg:#F4F3EF; --surface:#FFFFFF; --sunk:#EDEBE4;
  --ink:#191C20; --muted:#6B685F; --line:#DEDBD2;
  --accent:#A8742A; --accent-soft:#F0E4D0;
  --pub:#2A6F97; --priv:#8E3B76;
  --ok:#2E7D5B; --ok-soft:#DFF0E6;
  --bad:#B23A48; --bad-soft:#F8E1E3;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap}
.brand b{color:var(--accent);font-weight:600}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;
  display:grid;place-items:center;font-size:14px;color:var(--muted)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.rail{height:3px;background:var(--sunk)}
.rail i{display:block;height:100%;background:var(--accent);width:0;
  transition:width .35s cubic-bezier(.4,0,.2,1)}

.wrap{max-width:640px;margin:0 auto;padding:20px 16px 96px}

.nav{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--sunk);
  border-radius:var(--r);margin-bottom:22px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;background:none;border:0;padding:8px 13px;border-radius:7px;
  font-size:13.5px;color:var(--muted);white-space:nowrap}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.07)}

h1{font-size:25px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:15px;margin:30px 0 12px;letter-spacing:.09em;text-transform:uppercase;
  font-family:var(--mono);font-weight:600;color:var(--muted)}
.lede{color:var(--muted);margin:0 0 22px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:#FFF8EE;border:0;border-radius:9px;padding:13px 20px;
  font-weight:600;font-size:15px}
:root[data-theme="dark"] .btn:not(.ghost){color:#141414}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#141414}}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.tag.goal{color:var(--accent);border-color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.pub{color:var(--pub);font-weight:600}
.priv{color:var(--priv);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:27px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:3px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:400}

.meter{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m0{background:var(--line)}
.meter .m1{background:var(--accent)}
.meter .m2{background:var(--ok)}

.qhead{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.qtext{font-size:19px;line-height:1.4;font-weight:550;margin:0 0 18px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r);padding:14px 15px;min-height:52px;
  font-size:15.5px;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--muted)}
.opt .ltr{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;width:22px;height:22px;display:grid;
  place-items:center;flex:0 0 auto;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .ltr{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ltr{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ltr{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.opt.dim{opacity:.5}

.conf{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.conf p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.conf .row button{flex:1;min-width:130px}

.verdict{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;margin:20px 0 10px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.why{font-family:var(--serif);font-size:16.5px;line-height:1.62;background:var(--sunk);
  border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:15px 17px;margin:0}
.why b{font-weight:700}
.why code{font-family:var(--mono);font-size:.86em;background:var(--surface);padding:1px 5px;border-radius:4px}

.note{font-size:13.5px;color:var(--muted);margin-top:12px}
.note.warn{color:var(--bad)}

.flash{min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:14px;
  text-align:center;padding:26px 20px}
.flash .term{font-size:23px;font-weight:650;letter-spacing:-.01em}
.flash .def{font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--ink);text-align:left}

.cov{width:100%;border-collapse:collapse;font-size:14px}
.cov th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 8px 8px 0;
  border-bottom:1px solid var(--line)}
.cov td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.cov td:first-child{font-family:var(--mono);color:var(--muted);width:34px}
.cov td:last-child{width:34%}
.cov tr:last-child td{border-bottom:0}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:10px}
.list{margin:0;padding-left:20px}
.list li{margin-bottom:7px}
.list li:last-child{margin-bottom:0}

.scroller{overflow-x:auto}
svg .lbl{font-family:var(--mono);font-size:10px;fill:var(--muted);letter-spacing:.06em}
svg .nm{font-family:var(--sans);font-size:12px;fill:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <span class="brand"><b>SEC</b> &middot; <span id="countdown"></span></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="themeBtn" title="Thema wisselen" aria-label="Thema wisselen">◐</button>
  </div>
  <div class="rail"><i id="rail"></i></div>
</header>

<main class="wrap">
  <nav class="nav" id="nav"></nav>
  <div id="view"></div>
</main>

<script>
"use strict";

/* ============ 1. KALENDER ============ */
const EXAM = "2026-08-24";
const REST = ["2026-08-13","2026-08-20"];

function isoAdd(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);}
function todayISO(){return new Date().toISOString().slice(0,10);}

const STUDY_DAYS=(function(){const out=[];let d="2026-08-09";
  while(d<EXAM){if(!REST.includes(d))out.push(d);d=isoAdd(d,1);}return out;})();

function dayIndex(){const t=todayISO();
  if(t<=STUDY_DAYS[0])return 0;
  for(let i=0;i<STUDY_DAYS.length;i++)if(STUDY_DAYS[i]>=t)return i;
  return STUDY_DAYS.length-1;}
function daysLeftCalendar(){return Math.max(0,Math.round(
  (new Date(EXAM+"T12:00:00")-new Date(todayISO()+"T12:00:00"))/86400000));}
function studyDaysLeft(){return Math.max(1,STUDY_DAYS.length-dayIndex());}
function isTaperDay(){return todayISO()>="2026-08-23";}

/* ============ 2. KAARTENBANK ============
   Elke kaart heeft twee assen: t = onderwerp, g = doel.
   De doel-as is de diagnostische as -- fouten ontstaan doordat
   echte begrippen in het verkeerde vakje belanden. */
const G={V:"Vertrouwelijkheid",I:"Integriteit",A:"Authenticatie",
  O:"Onweerlegbaarheid",S:"Sleutelbeheer",B:"Grondbegrip"};

const CARDS = [];
/* ---- H1 Inleiding ---- */
CARDS.push(
{id:"1a",ch:1,t:"Beveiligingsdoelen",g:G.B,
 q:"Welke vier doelen wil je met cryptografie bereiken?",
 o:["Vertrouwelijkheid, integriteit, authenticatie, onweerlegbaarheid",
    "Vertrouwelijkheid, beschikbaarheid, integriteit, snelheid",
    "Encryptie, hashing, ondertekenen, certificeren",
    "Geheimhouding, sterkte, sleutellengte, entropie"],a:0,
 w:"De vier doelen zijn <b>vertrouwelijkheid</b> (niemand anders kan het lezen), <b>integriteit</b> (het is onderweg niet veranderd), <b>authenticatie</b> (de afzender is wie hij zegt) en <b>onweerlegbaarheid</b> (hij kan achteraf niet ontkennen dat hij het stuurde). Beschikbaarheid hoort wel bij informatiebeveiliging, maar los je niet op met crypto — daar helpt een back-up, geen sleutel."},

{id:"1b",ch:1,t:"Beveiligingsdoelen",g:G.O,
 q:"Wat houdt onweerlegbaarheid precies in?",
 o:["De afzender kan achteraf niet ontkennen dat hij het bericht verstuurd heeft",
    "Het bericht kan onderweg niet gewijzigd worden",
    "Alleen de bedoelde ontvanger kan het bericht lezen",
    "Het bericht komt gegarandeerd aan"],a:0,
 w:"<b>Onweerlegbaarheid</b> gaat over bewijs tegenover een derde. Bij een MAC delen zender en ontvanger dezelfde sleutel, dus kunnen ze allebei hetzelfde bericht maken — daar valt niets te bewijzen. Alleen een <b>digitale handtekening</b> geeft onweerlegbaarheid, want alleen de ondertekenaar heeft zijn <span class=\"priv\">private sleutel</span>.",
 cf:["5m","5n"]},

{id:"1c",ch:1,t:"Basisbegrippen",g:G.B,
 q:"Wat is het verschil tussen coderen en encrypten?",
 o:["Coderen is een omzetting zonder geheim; encrypten gebruikt een sleutel om iets geheim te maken",
    "Coderen is sterker dan encrypten",
    "Coderen gebruikt een publieke sleutel, encrypten een private",
    "Er is geen verschil, het zijn synoniemen"],a:0,
 w:"<b>Coderen</b> zet data in een andere vorm — ASCII, Base64, morse. Iedereen kan het terugdraaien, er is geen geheim. <b>Encrypten</b> maakt van platte tekst cryptotekst met een <b>sleutel</b>, en zonder die sleutel kom je er niet bij. Base64 is dus géén beveiliging."},

{id:"1d",ch:1,t:"Basisbegrippen",g:G.B,
 q:"Wat is cryptotekst?",
 o:["De versleutelde vorm van een bericht","De leesbare vorm van een bericht",
    "De sleutel waarmee versleuteld wordt","De hash van een bericht"],a:0,
 w:"<b>Platte tekst</b> is het leesbare bericht, <b>cryptotekst</b> het versleutelde resultaat. Encrypten gaat van plat naar crypto, decrypten weer terug."}
);

/* ---- H2 Principes ---- */
CARDS.push(
{id:"2a",ch:2,t:"Kerckhoff",g:G.B,
 q:"Wat zegt het principe van Kerckhoff?",
 o:["Een systeem moet veilig blijven ook als alles behalve de sleutel bekend is",
    "Een algoritme moet geheim blijven om veilig te zijn",
    "De sleutel moet minstens even lang zijn als het bericht",
    "Je moet altijd twee algoritmen over elkaar heen gebruiken"],a:0,
 w:"<b>Kerckhoff</b>: de veiligheid mag alleen in de <b>sleutel</b> zitten, niet in geheimhouding van het algoritme. Daarom worden goede algoritmen juist openbaar gepubliceerd — dan kan de hele wereld ze proberen te kraken. Het omgekeerde heet <b>security by obscurity</b> en is schijnzekerheid.",
 cf:["2b"]},

{id:"2b",ch:2,t:"Kerckhoff",g:G.B,
 q:"Waarom is de gekraakte OV-chipkaart (2008) hét voorbeeld van security by obscurity?",
 o:["Het geheime, zelfbedachte algoritme bleek zwak zodra het uitlekte",
    "De sleutels waren te kort gekozen",
    "Er werd een verouderde versie van AES gebruikt",
    "De kaarten hadden geen certificaat"],a:0,
 w:"De Mifare Classic gebruikte een geheimgehouden, zelf ontworpen algoritme. Zodra onderzoekers het reverse-engineerden, was het snel gekraakt. Een algoritme dat alleen veilig is zolang niemand het kent, is niet veilig — het is onbeproefd. Vandaar de vuistregel <b>never roll your own crypto</b>.",
 cf:["2a"]},

{id:"2c",ch:2,t:"Perfecte geheimhouding",g:G.V,
 q:"Wanneer is er sprake van perfecte geheimhouding volgens Shannon?",
 o:["Als de cryptotekst geen enkele informatie over de platte tekst prijsgeeft",
    "Als het algoritme geheim is","Als de sleutel langer is dan 256 bits",
    "Als het bericht ook nog gehasht wordt"],a:0,
 w:"<b>Perfecte geheimhouding</b> betekent dat je uit de cryptotekst niets over de platte tekst kunt afleiden — zelfs met oneindige rekenkracht niet. Dat kan alleen met een sleutel die net zo lang is als het bericht en die je maar één keer gebruikt. Praktisch onbruikbaar: je sleuteldistributieprobleem wordt dan net zo groot als het bericht zelf."},

{id:"2d",ch:2,t:"Eisen aan crypto",g:G.B,
 q:"Aan welke twee eisen moet een bruikbaar cryptografisch algoritme voldoen?",
 o:["Met de sleutel efficiënt te berekenen, zonder sleutel praktisch onmogelijk te kraken",
    "Snel te kraken en langzaam te berekenen","Geheim én gepatenteerd",
    "Omkeerbaar zonder sleutel maar traag"],a:0,
 w:"Het moet <b>efficiënt te berekenen</b> zijn voor wie de sleutel heeft — anders is het onbruikbaar — en <b>praktisch onmogelijk te kraken</b> voor wie hem niet heeft. \"Praktisch onmogelijk\" is geen wiskundige onmogelijkheid: het betekent dat het zó lang duurt dat de informatie tegen die tijd waardeloos is."},

{id:"2e",ch:2,t:"Sleutelsterkte",g:G.S,
 q:"3DES heeft een sleutellengte van 168 bits maar een sleutelsterkte van 112 bits. Wat betekent dat?",
 o:["Een bekende aanval maakt dat je effectief maar 112 bits hoeft te doorzoeken",
    "Er gaan 56 bits verloren bij het opslaan van de sleutel",
    "De sleutel wordt afgekapt tot 112 bits","112 bits is de lengte van de cryptotekst"],a:0,
 w:"<b>Sleutellengte</b> is hoeveel bits de sleutel telt; <b>sleutelsterkte</b> is hoeveel werk een aanvaller er écht aan heeft. Bij 3DES verlaagt de meet-in-the-middle-aanval de effectieve sterkte van 168 naar 112. Bij een goed algoritme vallen lengte en sterkte samen; verschillen ze, dan is er een zwakte gevonden. Bij asymmetrische algoritmen ligt de sterkte structureel veel lager dan de lengte.",
 cf:["2f","4d"]},

{id:"2f",ch:2,t:"Sleutelsterkte",g:G.S,
 q:"Een sleutel wordt gegenereerd uit 32 bits echte willekeur. Wat is de sleutelsterkte?",
 o:["31 bits","32 bits","16 bits","64 bits"],a:0,
 w:"Er zijn 2³² mogelijke sleutels, maar gemiddeld vind je de goede al na de hélft van je pogingen — 2³¹. De sterkte is dus <b>31 bits</b>. Let op waar de willekeur vandaan komt: is de sleutel 128 bits lang maar afgeleid van 32 bits entropie, dan is hij 31 bits sterk, niet 128.",
 cf:["2e","2g"]},

{id:"2g",ch:2,t:"Entropie",g:G.S,
 q:"Wat is entropie in de context van sleutels en wachtwoorden?",
 o:["De hoeveelheid echte onvoorspelbaarheid, uitgedrukt in bits",
    "De lengte van de sleutel in tekens","Het aantal keren dat een sleutel hergebruikt wordt",
    "De rekentijd die encryptie kost"],a:0,
 w:"<b>Entropie</b> meet onvoorspelbaarheid. Een wachtwoord van twintig tekens uit een bekend citaat heeft bijna geen entropie; vier willekeurige woorden uit een lijst van 2048 hebben 4 × 11 = 44 bits. Niet de lengte telt, maar hoeveel mogelijkheden een aanvaller moet aflopen.",
 cf:["2f","10c"]},

{id:"2h",ch:2,t:"Willekeur",g:G.S,
 q:"Waarom mag je sleutels niet genereren met een gewone random-functie?",
 o:["Die is voorspelbaar, waardoor een aanvaller de sleutel kan reproduceren",
    "Die is te traag voor grote sleutels","Die levert alleen even getallen op",
    "Die werkt niet op alle besturingssystemen"],a:0,
 w:"Een gewone pseudo-randomgenerator is deterministisch: ken je de seed, dan ken je de hele reeks. Voor sleutels heb je een <b>CSPRNG</b> nodig, die entropie haalt uit onvoorspelbare bronnen zoals timing en ruis. Op Linux is dat <code>/dev/random</code> en <code>/dev/urandom</code>, op Windows de Cryptography API."},

{id:"2i",ch:2,t:"Willekeur",g:G.S,
 q:"Wat doet /dev/random als er te weinig entropie in de pool zit?",
 o:["Het blokkeert tot er genoeg entropie verzameld is","Het geeft voorspelbare bits terug",
    "Het geeft een foutmelding","Het valt terug op een gewone randomfunctie"],a:0,
 w:"<code>/dev/random</code> blokkeert liever dan dat het zwakke willekeur uitgeeft. <code>/dev/urandom</code> blokkeert niet en levert altijd door — voor vrijwel alle toepassingen prima, zolang de pool ooit goed geïnitialiseerd is. Het punt: veilige willekeur is een schaars goed dat het systeem echt moet verzamelen."}
);

/* ---- H3 Symmetrische encryptie ---- */
CARDS.push(
{id:"3a",ch:3,t:"Symmetrisch",g:G.V,
 q:"Wat kenmerkt symmetrische encryptie?",
 o:["Dezelfde sleutel wordt gebruikt om te encrypten en te decrypten",
    "Er is een publieke en een private sleutel","Er is helemaal geen sleutel nodig",
    "De sleutel is altijd 128 bits lang"],a:0,
 w:"Bij <b>symmetrische encryptie</b> is de sleutel voor versleutelen en ontsleutelen dezelfde. Dat maakt het snel en sterk, maar levert meteen het grote probleem op: hoe krijgt de ander die sleutel zonder dat iemand meekijkt?",
 cf:["4a"]},

{id:"3b",ch:3,t:"Sleuteluitwisseling",g:G.S,
 q:"Waarom mag je een symmetrische sleutel niet over hetzelfde kanaal sturen als het bericht?",
 o:["Wie het bericht onderschept, onderschept de sleutel ook en kan alles lezen",
    "Omdat de sleutel dan te lang wordt","Omdat het kanaal daar technisch ongeschikt voor is",
    "Omdat de sleutel dan verloopt"],a:0,
 w:"Dit is het <b>sleuteldistributieprobleem</b>. Stuur je de sleutel over hetzelfde kanaal, dan heb je niets beveiligd — de afluisteraar krijgt sleutel én cryptotekst. De sleutel moet <b>out-of-band</b>: via een ander kanaal, persoonlijk, of via asymmetrische crypto. Precies daarom bestaat het hybride model van TLS.",
 cf:["3c","8a"]},

{id:"3c",ch:3,t:"Sleuteluitwisseling",g:G.S,
 q:"Wat betekent out-of-band bij sleuteluitwisseling?",
 o:["Via een ander kanaal dan waar het versleutelde bericht overheen gaat",
    "Buiten de frequentieband van het netwerk","Met een sleutel die buiten het algoritme valt",
    "Zonder encryptie"],a:0,
 w:"<b>Out-of-band</b> wil zeggen: langs een andere weg. Bericht per e-mail, sleutel per telefoon of persoonlijk overhandigd. Het idee is dat een aanvaller beide kanalen tegelijk zou moeten beheersen. Hetzelfde principe zie je terug bij tweefactorauthenticatie via sms.",
 cf:["3b","10j"]},

{id:"3d",ch:3,t:"Symmetrisch",g:G.O,
 q:"Een aanvaller bemachtigt de symmetrische sleutel van een lopende communicatie. Wat kan hij daarmee NIET?",
 o:["Bewijzen tegenover een derde wie het oorspronkelijke bericht schreef",
    "Onderschepte berichten ontsleutelen","Zelf berichten versleutelen die echt lijken",
    "Eerder opgeslagen cryptotekst alsnog lezen"],a:0,
 w:"Met de sleutel kan hij meelezen, zich voordoen als een van beide partijen, oude opgeslagen berichten alsnog ontsleutelen en berichten wijzigen. Wat hij niet kan, kan niemand: bij symmetrische crypto bestaat geen <b>onweerlegbaarheid</b>, want beide partijen hebben dezelfde sleutel en kunnen dus allebei hetzelfde bericht maken.",
 cf:["1b","5n"]},

{id:"3e",ch:3,t:"ROT-13",g:G.B,
 q:"Waarom is ROT-13 geen serieuze encryptie?",
 o:["Er is geen sleutel: wie het algoritme kent, kan het altijd terugdraaien",
    "De sleutel is te kort","Het werkt alleen op cijfers","Het is te traag"],a:0,
 w:"ROT-13 verschuift elke letter dertien plaatsen. Er valt niets te kiezen, dus er is geen <b>sleutel</b> — en volgens Kerckhoff zit daar juist de hele veiligheid in. Het is een <b>codering</b>, geen encryptie: bedoeld om iets niet per ongeluk te lezen, niet om het geheim te houden.",
 cf:["1c"]}
);

/* ---- H4 Asymmetrische encryptie ---- */
CARDS.push(
{id:"4a",ch:4,t:"Asymmetrisch",g:G.B,
 q:"Wat kenmerkt asymmetrische encryptie?",
 o:["Een sleutelpaar: wat met de ene sleutel versleuteld is, kan alleen met de andere open",
    "Eén sleutel die zender en ontvanger delen","Helemaal geen sleutel, alleen een algoritme",
    "Twee identieke sleutels op twee plaatsen"],a:0,
 w:"Je hebt een <span class=\"pub\">publieke sleutel</span> die je rondstrooit en een <span class=\"priv\">private sleutel</span> die je nooit afgeeft. Ze horen bij elkaar: wat met de ene dichtgaat, gaat alleen met de andere open. Dat lost het sleuteldistributieprobleem op — je hoeft niets geheims meer uit te wisselen.",
 cf:["3a"]},

{id:"4b",ch:4,t:"Sleutelrichting",g:G.V,
 q:"Je wilt een bericht sturen dat alleen Bob kan lezen. Met welke sleutel versleutel je?",
 o:["Bobs publieke sleutel","Bobs private sleutel","Jouw private sleutel","Jouw publieke sleutel"],a:0,
 w:"Voor <b>vertrouwelijkheid</b> versleutel je met de <span class=\"pub\">publieke sleutel van de ontvanger</span>. Alleen Bob heeft de bijbehorende <span class=\"priv\">private sleutel</span>, dus alleen hij krijgt het open. Vuistregel: <i>geheimhouden → sleutel van de ánder; ondertekenen → je eigen sleutel</i>.",
 cf:["4c","4e"]},

{id:"4c",ch:4,t:"Sleutelrichting",g:G.O,
 q:"Je wilt dat iedereen kan controleren dat een bericht écht van jou komt. Met welke sleutel versleutel je?",
 o:["Jouw private sleutel","Jouw publieke sleutel","De publieke sleutel van de ontvanger",
    "De private sleutel van de ontvanger"],a:0,
 w:"Voor <b>ondertekenen</b> gebruik je je eigen <span class=\"priv\">private sleutel</span>. Iedereen kan het met jouw <span class=\"pub\">publieke sleutel</span> controleren, en omdat alleen jij die private sleutel hebt, is dat meteen het bewijs. Let op: dit is géén geheimhouding — de hele wereld kan het lezen. Precies andersom dan bij vertrouwelijkheid.",
 cf:["4b","5m"]},

{id:"4d",ch:4,t:"Asymmetrisch",g:G.B,
 q:"Wat is een nadeel van asymmetrische encryptie ten opzichte van symmetrische?",
 o:["Het is ongeveer duizend keer trager","Het biedt geen authenticatie",
    "De sleutel moet out-of-band worden uitgewisseld","Het werkt alleen op korte sleutels"],a:0,
 w:"Asymmetrisch is ruwweg <b>duizend keer trager</b>, levert per bit sleutellengte veel minder <b>sleutelsterkte</b> op (vandaar RSA-2048 tegenover AES-128) en maakt de cryptotekst langer. Daarom versleutel je er nooit je hele dataverkeer mee, maar alleen de sessiesleutel — het <b>hybride model</b>.",
 cf:["2e","4f"]},

{id:"4e",ch:4,t:"Trapdoor",g:G.B,
 q:"Waarop berust de veiligheid van RSA?",
 o:["Twee grote priemgetallen vermenigvuldigen is makkelijk, het product weer ontbinden niet",
    "Het algoritme wordt geheimgehouden","De sleutel wordt elke sessie vervangen",
    "De cryptotekst is langer dan de platte tekst"],a:0,
 w:"Een <b>trapdoorfunctie</b> is één kant op makkelijk en de andere kant op praktisch onmogelijk — tenzij je de geheime ingang kent. Bij RSA is dat <b>priemfactorontbinding</b>: twee grote priemgetallen vermenigvuldigen kost niets, het product terugontbinden kost eeuwen. Je private sleutel is die geheime ingang."},

{id:"4f",ch:4,t:"Hybride model",g:G.S,
 q:"Wat is het hybride model?",
 o:["Asymmetrisch een symmetrische sessiesleutel uitwisselen, en daarna symmetrisch versleutelen",
    "Twee symmetrische algoritmen achter elkaar","Een hash combineren met een certificaat",
    "Afwisselend publieke en private sleutels gebruiken"],a:0,
 w:"Je gebruikt het beste van twee werelden: asymmetrisch is traag maar lost sleuteluitwisseling op, symmetrisch is snel maar niet uit te wisselen. Dus wissel je asymmetrisch een <b>sessiesleutel</b> uit en versleutel je daarna alle data symmetrisch. Dit is exact wat TLS doet.",
 cf:["4d","8a"]},

{id:"4g",ch:4,t:"Asymmetrisch",g:G.A,
 q:"Wat is het risico als je iemands publieke sleutel zomaar van internet plukt?",
 o:["Je weet niet of hij echt van die persoon is — een aanvaller kan de zijne aanbieden",
    "Publieke sleutels verlopen na een dag","De sleutel wordt daarmee onbruikbaar",
    "Je kunt er dan niet meer mee ondertekenen"],a:0,
 w:"Een publieke sleutel mag iedereen zien, maar je moet wél weten dat hij bij de juiste persoon hoort. Anders zet een man-in-the-middle zijn eigen sleutel neer en leest alles mee. Dat probleem — de koppeling tussen sleutel en identiteit — lossen <b>certificaten</b> en de <b>chain of trust</b> op.",
 cf:["7a","7c"]}
);

/* ---- H5 Hashing, MAC en ondertekenen ---- */
CARDS.push(
{id:"5a",ch:5,t:"Checksum",g:G.I,
 q:"Waarvoor dient een gewone checksum, zoals een XOR over alle bytes?",
 o:["Toevallige fouten in de overdracht opsporen","Een bericht geheim maken",
    "De afzender authenticeren","Onweerlegbaarheid vastleggen"],a:0,
 w:"Een <b>checksum</b> vangt <b>toevallige</b> fouten — ruis op de lijn, een omgevallen bit. Tegen een aanvaller helpt hij niet: die past het bericht aan én berekent de nieuwe checksum. Voor opzet heb je een cryptografisch veilige hash nodig, en voor bescherming tegen wijziging bovendien een sleutel (MAC).",
 cf:["5e","5j"]},

{id:"5b",ch:5,t:"Hashfunctie",g:G.I,
 q:"Wat is een hashfunctie?",
 o:["Een functie die willekeurig lange invoer omzet in een vaste, korte uitvoer",
    "Een functie die tekst versleutelt met een sleutel",
    "Een functie die cryptotekst weer leesbaar maakt",
    "Een functie die een sleutelpaar genereert"],a:0,
 w:"Een <b>hashfunctie</b> perst invoer van elke lengte in een uitvoer van vaste lengte — bij MD5 altijd 128 bits, bij SHA-256 altijd 256. Hij is <b>eenrichtingsverkeer</b>: uit de hash krijg je de invoer niet terug. En er is geen sleutel bij betrokken, dus een hash op zichzelf beschermt nergens tegen een aanvaller.",
 cf:["5j","5m"]},

{id:"5c",ch:5,t:"Collisie",g:G.I,
 q:"Wat is een collisie bij een hashfunctie?",
 o:["Twee verschillende invoeren leveren dezelfde hash op",
    "Twee hashes worden tegelijk berekend","De hash is langer dan de invoer",
    "De hashfunctie geeft een foutmelding"],a:0,
 w:"Een <b>collisie</b> is twee verschillende invoeren met dezelfde hash. Bij een cryptografisch veilige hash mag het praktisch onmogelijk zijn er zelf een te construeren. MD5 en SHA-1 zijn juist afgeschreven omdát dat wél kan — dan kun je een handtekening onder een ander document schuiven.",
 cf:["5d","6f"]},

{id:"5d",ch:5,t:"Collisie",g:G.I,
 q:"Waarom bestaan er sowieso collisies bij elke hashfunctie?",
 o:["Er zijn oneindig veel invoeren en maar een eindig aantal mogelijke hashes",
    "Omdat hashfuncties niet zorgvuldig ontworpen zijn",
    "Alleen bij MD5, niet bij SHA-256","Omdat de hash altijd korter is dan de sleutel"],a:0,
 w:"Het <b>duiventilprincipe</b>: stop je oneindig veel berichten in 2¹²⁸ vakjes, dan zitten er onvermijdelijk meerdere in hetzelfde vakje. Collisies <i>bestaan</i> dus altijd. Het verschil tussen een goede en een gebroken hash is niet of ze bestaan, maar of je er eentje kunt vínden.",
 cf:["5c"]},

{id:"5e",ch:5,t:"Veilige hash",g:G.I,
 q:"Wanneer noem je een hashfunctie cryptografisch veilig?",
 o:["Als je er praktisch geen invoer bij kunt vinden en geen collisies kunt construeren",
    "Als de hash langer is dan 64 bits","Als er een geheime sleutel in verwerkt zit",
    "Als hij heel snel te berekenen is"],a:0,
 w:"Drie eisen: je kunt uit de hash de invoer niet terugrekenen, je kunt bij een gegeven hash geen passende invoer vinden, en je kunt geen twee invoeren met dezelfde hash construeren. Snelheid is juist géén pluspunt — bij wachtwoorden wil je expres een trage functie.",
 cf:["5c","5i"]},

{id:"5f",ch:5,t:"Rainbow table",g:G.V,
 q:"Wat is een rainbow table?",
 o:["Een vooraf berekende tabel van hashes waarmee je snel het bijbehorende wachtwoord opzoekt",
    "Een tabel met alle mogelijke sleutels van een algoritme",
    "Een overzicht van welk algoritme wanneer verouderd raakt",
    "Een lijst met ingetrokken certificaten"],a:0,
 w:"Een aanvaller berekent van tevoren de hashes van miljarden wachtwoorden. Buit hij een database met hashes, dan is het nog slechts opzoeken. Het tegengif is een <b>salt</b>: die maakt de tabel per gebruiker waardeloos, want hij zou hem voor elke salt opnieuw moeten bouwen.",
 cf:["5g"]},

{id:"5g",ch:5,t:"Salt",g:G.V,
 q:"Wat doet een salt bij het opslaan van wachtwoorden?",
 o:["Het voegt per gebruiker unieke willekeur toe, zodat gelijke wachtwoorden verschillende hashes krijgen",
    "Het versleutelt de hash met een geheime sleutel",
    "Het maakt de hash korter","Het zorgt dat het wachtwoord terug te rekenen is"],a:0,
 w:"Een <b>salt</b> is een willekeurige waarde die per gebruiker bij het wachtwoord wordt gezet vóór het hashen. Twee mensen met hetzelfde wachtwoord krijgen zo verschillende hashes, en vooraf berekende rainbow tables worden nutteloos. De salt hoeft niet geheim te zijn — hij wordt gewoon in leesbare vorm naast de hash opgeslagen.",
 cf:["5f","5h"]},

{id:"5h",ch:5,t:"Salt",g:G.V,
 q:"Waarom is het geen probleem dat de salt onversleuteld in de database staat?",
 o:["De salt hoeft alleen uniek te zijn; hij moet het vooraf berekenen onmogelijk maken, niet geheim zijn",
    "Omdat de salt toch niet te lezen is","Omdat de salt na gebruik gewist wordt",
    "Dat is wel een probleem, het hoort versleuteld te zijn"],a:0,
 w:"Het werk van de salt zit in <b>uniciteit</b>, niet in geheimhouding. De aanvaller moet zijn tabel per gebruiker opnieuw opbouwen, en dat is precies de bedoeling. Een geheime waarde die je toevoegt heet trouwens een <i>pepper</i> — een ander middel voor een ander doel.",
 cf:["5g"]},

{id:"5i",ch:5,t:"Wachtwoordopslag",g:G.V,
 q:"Waarom sla je wachtwoorden gehasht op in plaats van versleuteld?",
 o:["Bij een hash is er geen sleutel die gestolen kan worden om alles terug te draaien",
    "Hashen is sneller dan versleutelen","Een hash is korter en bespaart opslag",
    "Versleutelde wachtwoorden zijn niet te vergelijken"],a:0,
 w:"Versleutelen is <b>omkeerbaar</b>: wie de sleutel buitmaakt, heeft alle wachtwoorden in leesbare vorm. Hashen is eenrichtingsverkeer — er ís geen sleutel. Je bewaart de hash en vergelijkt bij het inloggen de hash van wat er ingetypt wordt. Zelfs de beheerder kan het wachtwoord dan niet zien.",
 cf:["5e","5g"]},

{id:"5j",ch:5,t:"MAC",g:G.A,
 q:"Wat voegt een MAC toe ten opzichte van een gewone hash?",
 o:["Een gedeelde geheime sleutel, waardoor de ontvanger ook weet van wie het komt",
    "Een langere uitvoer","Onweerlegbaarheid tegenover een rechter",
    "Versleuteling van de inhoud"],a:0,
 w:"Een <b>MAC</b> is een hash mét een gedeelde geheime sleutel. Een gewone hash kan iedereen opnieuw uitrekenen, dus een aanvaller past bericht én hash aan. Bij een MAC kan dat niet zonder de sleutel: je krijgt <b>integriteit én authenticatie</b>. Maar geen onweerlegbaarheid, want beide partijen hebben dezelfde sleutel.",
 cf:["5b","5m","5n"]},

{id:"5k",ch:5,t:"HMAC",g:G.A,
 q:"Wat is HMAC?",
 o:["Een gestandaardiseerde constructie om veilig een MAC uit een hashfunctie te bouwen",
    "Een asymmetrisch handtekeningalgoritme","Een hashfunctie zonder sleutel",
    "Een methode om sleutels uit te wisselen"],a:0,
 w:"Sleutel en bericht zomaar achter elkaar plakken en hashen levert aanvalbare constructies op. <b>HMAC</b> (RFC 2104) doet het goed: het hasht twee keer, met de sleutel op twee gedefinieerde manieren verwerkt. Je ziet het als <code>HMAC-SHA256</code> — HMAC is de constructie, SHA-256 de hash eronder.",
 cf:["5j"]},

{id:"5m",ch:5,t:"Digitale handtekening",g:G.O,
 q:"Hoe zet je een digitale handtekening?",
 o:["Je hasht het document en versleutelt die hash met je private sleutel",
    "Je versleutelt het document met de publieke sleutel van de ontvanger",
    "Je hasht het document samen met een gedeelde geheime sleutel",
    "Je versleutelt het document met je publieke sleutel"],a:0,
 w:"Eerst <b>hashen</b>, dan die hash versleutelen met je <span class=\"priv\">private sleutel</span>. Hashen omdat asymmetrisch traag is en de hash klein — je hoeft niet het hele document door RSA te halen. De ontvanger ontsleutelt de handtekening met jouw <span class=\"pub\">publieke sleutel</span>, hasht het document zelf en vergelijkt. Kloppen ze, dan is het document ongewijzigd én van jou.",
 cf:["4c","5j","5n"]},

{id:"5n",ch:5,t:"Doelen-tabel",g:G.B,
 q:"Welke techniek levert vertrouwelijkheid, integriteit, authenticatie én onweerlegbaarheid tegelijk?",
 o:["Geen enkele: een digitale handtekening dekt alles behalve vertrouwelijkheid",
    "Een cryptografisch veilige hash","HMAC","Een salt bij het wachtwoord"],a:0,
 w:"Dit is de tabel die je uit je hoofd moet kennen. <b>Hash</b>: geen sleutel, alleen integriteit. <b>MAC/HMAC</b>: symmetrische sleutel, integriteit én authenticatie. <b>Digitale handtekening</b>: asymmetrisch, integriteit, authenticatie én onweerlegbaarheid. <b>Vertrouwelijkheid</b> krijg je van geen van drieën — daarvoor moet je encrypten.",
 cf:["5b","5j","5m"]},

{id:"5o",ch:5,t:"Digitale handtekening",g:G.I,
 q:"Waarom onderteken je de hash van een document en niet het document zelf?",
 o:["Asymmetrische crypto is traag; de hash is klein en vertegenwoordigt het hele document",
    "Omdat het document geheim moet blijven","Omdat een hash niet te vervalsen is zonder sleutel",
    "Omdat het document anders langer wordt dan toegestaan"],a:0,
 w:"Asymmetrisch versleutelen is ruwweg duizend keer trager dan symmetrisch; een bestand van 100 MB erdoorheen halen is onwerkbaar. De hash is een paar tientallen bytes en verandert bij de kleinste wijziging in het document — dus wie de hash tekent, tekent effectief het hele document.",
 cf:["5m","4d"]},

{id:"5p",ch:5,t:"Foutcorrectie",g:G.I,
 q:"Wat kan een error correcting code dat een gewone checksum niet kan?",
 o:["Kleine fouten niet alleen opsporen maar ook herstellen",
    "De afzender authenticeren","De data versleutelen","Collisies uitsluiten"],a:0,
 w:"Een gewone checksum zegt alleen <i>er is iets mis</i>. Een <b>error correcting code</b> voegt zoveel redundantie toe dat de ontvanger de fout ook kan repareren zonder te hoeven vragen om hertransmissie. Nuttig bij ruis, maar net als een checksum weerloos tegen opzet.",
 cf:["5a"]}
);

/* ---- H6 Algoritmen ---- */
CARDS.push(
{id:"6a",ch:6,t:"Algoritmen",g:G.B,
 q:"Wat voor soort algoritme is AES (Rijndael)?",
 o:["Symmetrisch, en de huidige standaard","Asymmetrisch, en de huidige standaard",
    "Een hashfunctie","Symmetrisch, maar verouderd"],a:0,
 w:"<b>AES</b> is het <b>symmetrische</b> blokcijfer dat uit de Rijndael-inzending kwam en nu de standaard is. AES-128 geldt als ruim voldoende. Onthoud de indeling in twee assen: <i>soort</i> (symmetrisch / asymmetrisch / hash) en <i>status</i> (verouderd / legacy / actueel).",
 cf:["6b","6d"]},

{id:"6b",ch:6,t:"Algoritmen",g:G.B,
 q:"Wat voor soort algoritme is RSA?",
 o:["Asymmetrisch; RSA-2048 is actueel, RSA-512 veel te zwak",
    "Symmetrisch en actueel","Een hashfunctie","Asymmetrisch maar volledig verouderd"],a:0,
 w:"<b>RSA</b> is <b>asymmetrisch</b>. Omdat asymmetrische sleutels per bit veel minder sterkte leveren, heb je er veel meer van nodig: RSA-2048 is de norm, RSA-512 is triviaal te kraken. Vergelijk dat met AES-128, dat met acht keer minder bits ruim veiliger is.",
 cf:["6a","4d"]},

{id:"6c",ch:6,t:"Algoritmen",g:G.B,
 q:"Wat voor soort algoritme is SHA-256?",
 o:["Een hashfunctie, en actueel","Een symmetrisch algoritme","Een asymmetrisch algoritme",
    "Een hashfunctie, maar verouderd"],a:0,
 w:"<b>SHA-256</b> is een <b>hashfunctie</b> en is actueel. Hashfuncties hebben geen sleutel — dat is meteen de snelste manier om ze te herkennen. Uit dezelfde familie: SHA-0 en SHA-1 zijn afgeschreven, SHA-2 (waaronder SHA-256) en SHA-3 zijn dat niet.",
 cf:["6d","6f"]},

{id:"6d",ch:6,t:"Algoritmen",g:G.B,
 q:"Welk algoritme hieronder is asymmetrisch én actueel?",
 o:["Curve25519","MD5","Blowfish","RC4"],a:0,
 w:"<b>Curve25519</b> is elliptische-krommecrypto: <b>asymmetrisch</b> en actueel. MD5 is een gebroken <i>hash</i>, RC4 een afgeschreven <i>symmetrische</i> stroomcijfer, Blowfish een symmetrisch blokcijfer dat je nu niet meer kiest. Let op de valkuil: op een meerkeuzevraag staan er altijd bekende namen uit de verkeerde categorie tussen.",
 cf:["6f","6a","6b"]},

{id:"6e",ch:6,t:"Algoritmen",g:G.O,
 q:"Waar dienen DSA en ECDSA voor?",
 o:["Digitaal ondertekenen","Data versleutelen","Hashen van wachtwoorden",
    "Symmetrische sleutels genereren"],a:0,
 w:"<b>DSA</b> en <b>ECDSA</b> zijn <b>handtekeningalgoritmen</b> — de S staat voor Signature. Ze zijn asymmetrisch, maar in tegenstelling tot RSA kun je er niet mee versleutelen; ze zijn er alleen om te ondertekenen en te verifiëren. ECDSA is de variant op elliptische krommen en levert bij kortere sleutels dezelfde sterkte.",
 cf:["5m","6b"]},

{id:"6f",ch:6,t:"Algoritmen",g:G.B,
 q:"Waarom mag MD5 niet meer gebruikt worden voor beveiliging?",
 o:["Er zijn praktisch uitvoerbare collisie-aanvallen op bekend",
    "De hash is te lang geworden","Het is asymmetrisch en dus te traag",
    "Er zit geen sleutel in"],a:0,
 w:"Voor <b>MD5</b> (en inmiddels ook SHA-1) kun je met normale rekenkracht twee verschillende bestanden maken met dezelfde hash. Dan kun je een handtekening van het ene document onder het andere schuiven en klopt de verificatie nog steeds. MD5 als niet-cryptografische checksum voor downloads kan nog; voor beveiliging niet meer.",
 cf:["5c","6c"]},

{id:"6g",ch:6,t:"Algoritmen",g:G.B,
 q:"Waarom wordt DES tegenwoordig als onveilig beschouwd?",
 o:["De sleutel is met 56 bits te kort om brute force te weerstaan",
    "Het algoritme is nooit gepubliceerd","Het is een hashfunctie zonder collisieweerstand",
    "Het gebruikt een publieke sleutel"],a:0,
 w:"<b>DES</b> is symmetrisch en op zichzelf niet slecht ontworpen — het probleem is de <b>sleutellengte</b> van 56 bits, die met moderne hardware in korte tijd volledig af te lopen is. 3DES lapt dat op door DES drie keer toe te passen (168 bits lengte, 112 sterkte), maar geldt inmiddels als legacy: nieuwe systemen gebruiken AES.",
 cf:["2e","6a"]},

{id:"6h",ch:6,t:"Algoritmen",g:G.B,
 q:"Je moet nu een systeem ontwerpen. Welke combinatie is verstandig?",
 o:["AES-256 voor de data, RSA-2048 of Curve25519 voor sleuteluitwisseling, SHA-256 voor hashing",
    "3DES voor de data, RSA-512 voor sleutels, MD5 voor hashing",
    "RC4 voor de data, DSA voor sleutels, SHA-1 voor hashing",
    "Een eigen algoritme, want dat kent niemand"],a:0,
 w:"Symmetrisch voor het volume, asymmetrisch voor de sleuteluitwisseling, een actuele hash voor integriteit. De andere opties combineren juist de afgeschreven namen: 3DES en RC4 zijn legacy of gebroken, RSA-512 veel te kort, MD5 en SHA-1 collisie-gevoelig. En een eigen algoritme is de klassieke fout — <b>never roll your own crypto</b>.",
 cf:["6d","2b"]}
);

/* ---- H7 Certificaten ---- */
CARDS.push(
{id:"7a",ch:7,t:"Certificaat",g:G.A,
 q:"Wat staat er in een X.509-certificaat?",
 o:["Een publieke sleutel plus identiteitsgegevens, ondertekend door een CA",
    "Een private sleutel plus het wachtwoord van de eigenaar",
    "De symmetrische sessiesleutel voor de verbinding",
    "Een hash van alle bezochte websites"],a:0,
 w:"Een <b>certificaat</b> koppelt een <span class=\"pub\">publieke sleutel</span> aan een identiteit, en die koppeling is <b>ondertekend door een Certificate Authority</b>. Zonder die handtekening zou iedereen kunnen beweren dat zijn sleutel bij jouw bank hoort. <b>X.509</b> is het standaardformaat. Een private sleutel zit er nooit in — die verlaat de eigenaar nooit.",
 cf:["4g","7c"]},

{id:"7b",ch:7,t:"CA",g:G.A,
 q:"Wat is de rol van een Certificate Authority?",
 o:["Controleren wie je bent en dat vervolgens met een handtekening vastleggen",
    "Het verkeer tussen browser en server versleutelen",
    "Sessiesleutels genereren voor elke verbinding",
    "Wachtwoorden van gebruikers bewaren"],a:0,
 w:"Een <b>CA</b> is de vertrouwde derde partij: die verifieert dat jij echt de eigenaar van het domein of het bedrijf bent, en ondertekent dan jouw certificaat. Alle vertrouwen in het systeem hangt op de aanname dat de CA zijn werk goed doet — daarom is een gecompromitteerde CA (zoals DigiNotar) zo ernstig.",
 cf:["7a","7c"]},

{id:"7c",ch:7,t:"Chain of trust",g:G.A,
 q:"Hoe controleert je browser of een certificaat te vertrouwen is?",
 o:["Hij volgt de handtekeningen omhoog tot een root die in het systeem al vertrouwd wordt",
    "Hij vraagt het na bij de website zelf",
    "Hij vergelijkt het certificaat met een lokale kopie van vorige keer",
    "Hij controleert alleen of het certificaat niet verlopen is"],a:0,
 w:"De <b>chain of trust</b>: het servercertificaat is ondertekend door een tussenliggende CA, die weer door een hogere, tot je bij een <b>rootcertificaat</b> uitkomt. Dat root is <b>self-signed</b> en zit al in je besturingssysteem of browser — dáár begint het vertrouwen. Klopt een schakel niet, of ontbreekt de root, dan krijg je een waarschuwing.",
 cf:["7a","7d"]},

{id:"7d",ch:7,t:"Rootcertificaat",g:G.A,
 q:"Wat is bijzonder aan een rootcertificaat?",
 o:["Het is self-signed en wordt vertrouwd omdat het vooraf in je systeem is opgenomen",
    "Het is ondertekend door de overheid","Het verloopt nooit",
    "Het bevat de private sleutels van alle onderliggende certificaten"],a:0,
 w:"Een <b>rootcertificaat</b> heeft niemand boven zich, dus tekent het zichzelf — <b>self-signed</b>. Die handtekening bewijst dus niets; het vertrouwen komt ervandaan dat je OS- of browserleverancier het in de lijst heeft gezet en beheert. Zet iemand daar een eigen root tussen, dan kan die al je verkeer ongemerkt onderscheppen.",
 cf:["7c"]},

{id:"7e",ch:7,t:"PKI",g:G.A,
 q:"Wat is een PKI?",
 o:["Het geheel van CA's, certificaten en procedures waarmee sleutels aan identiteiten gekoppeld worden",
    "Een algoritme voor asymmetrische encryptie",
    "Een protocol voor het versleutelen van webverkeer",
    "Een database met alle publieke sleutels ter wereld"],a:0,
 w:"<b>Public Key Infrastructure</b> is niet één ding maar de hele organisatie eromheen: de CA's, de uitgifte- en intrekkingsprocedures, de formaten en de vertrouwensrelaties. Het lost het probleem op waar asymmetrische crypto zelf geen antwoord op heeft — <i>van wie is deze publieke sleutel eigenlijk?</i>",
 cf:["7b","7c"]},

{id:"7f",ch:7,t:"Certificaattypen",g:G.A,
 q:"Wat is het verschil tussen een DV- en een EV-certificaat?",
 o:["Bij DV is alleen domeinbezit gecontroleerd, bij EV ook de identiteit van de organisatie",
    "DV gebruikt sterkere sleutels dan EV","EV is gratis, DV kost geld",
    "DV werkt alleen op subdomeinen"],a:0,
 w:"<b>DV</b> (Domain Validated) bewijst alleen dat je het domein beheert — geautomatiseerd en gratis via Let's Encrypt. <b>OV</b> (Organisation Validated) controleert daarnaast het bestaan van de organisatie, <b>EV</b> (Extended Validation) doet de zwaarste controle. Let op: de <b>encryptie is bij alle drie even sterk</b>; het verschil zit puur in hoe goed is nagegaan wie je bent.",
 cf:["7g"]},

{id:"7g",ch:7,t:"Certificaattypen",g:G.V,
 q:"Een site heeft een gratis Let's Encrypt-certificaat. Wat kun je daaruit concluderen?",
 o:["Het verkeer is volwaardig versleuteld, maar er is alleen domeinbezit gecontroleerd",
    "Het verkeer is zwakker versleuteld dan bij een betaald certificaat",
    "De organisatie achter de site is geverifieerd",
    "Het certificaat wordt door browsers niet vertrouwd"],a:0,
 w:"Het slotje zegt: <b>de verbinding is versleuteld en het certificaat hoort bij dit domein</b>. Het zegt niets over de betrouwbaarheid van de eigenaar — ook een phishingsite kan een geldig DV-certificaat hebben. Dat is precies de klassieke denkfout bij het slotje.",
 cf:["7f"]},

{id:"7h",ch:7,t:"Fingerprint",g:G.I,
 q:"Waarvoor gebruik je de fingerprint van een certificaat?",
 o:["Om via een ander kanaal te controleren of je het juiste certificaat voor je hebt",
    "Om het certificaat te versleutelen","Om de geldigheidsduur te verlengen",
    "Om het certificaat in te trekken"],a:0,
 w:"Een <b>fingerprint</b> is een hash van het hele certificaat: een korte reeks die je met het oog kunt vergelijken. Je gebruikt hem als je het certificaat handmatig wilt verifiëren, bijvoorbeeld door hem telefonisch door te nemen. Weer datzelfde <b>out-of-band</b>-idee.",
 cf:["3c","8f"]},

{id:"7i",ch:7,t:"Intrekken",g:G.A,
 q:"Waarom moet een certificaat ingetrokken kunnen worden vóór de vervaldatum?",
 o:["Omdat de private sleutel gestolen kan zijn, en het certificaat dan misbruikt wordt",
    "Omdat de CA anders te veel geld misloopt","Omdat de publieke sleutel verloopt",
    "Omdat het domein anders niet bereikbaar is"],a:0,
 w:"Lekt de <span class=\"priv\">private sleutel</span>, dan kan een aanvaller zich met dat geldige certificaat voordoen als de server. <b>Revocation</b> maakt het per direct ongeldig. Dat is ook de reden dat certificaten een beperkte <b>geldigheidsduur</b> hebben: hoe korter, hoe kleiner het venster waarin een gestolen sleutel bruikbaar is.",
 cf:["7d"]},

{id:"7j",ch:7,t:"OpenSSL-bestanden",g:G.B,
 q:"Wat is het verschil tussen de extensie .pem en extensies als .crt, .key en .csr?",
 o:[".pem zegt iets over het bestandsformaat, de andere over het doel van de inhoud",
    ".pem is versleuteld, de andere niet",".pem is voor servers, de rest voor clients",
    "Er is geen verschil, het zijn synoniemen"],a:0,
 w:"<code>.pem</code> beschrijft het <b>formaat</b>: base64 met BEGIN/END-regels eromheen. <code>.crt</code> (certificaat), <code>.key</code> (private sleutel), <code>.csr</code> (aanvraag richting de CA) en <code>.pkcs12</code> beschrijven het <b>doel</b>. Een <code>.crt</code> kan dus prima in pem-formaat staan — de twee assen staan los van elkaar.",
 cf:["7k"]},

{id:"7k",ch:7,t:"OpenSSL-bestanden",g:G.A,
 q:"Wat stuur je naar de CA als je een certificaat aanvraagt?",
 o:["Een CSR met je publieke sleutel en je gegevens","Je private sleutel",
    "Het rootcertificaat van de CA","De fingerprint van je vorige certificaat"],a:0,
 w:"Een <b>CSR</b> (Certificate Signing Request) bevat je <span class=\"pub\">publieke sleutel</span> en je identiteitsgegevens. De CA controleert die gegevens en tekent ze, en stuurt het certificaat terug. Je <span class=\"priv\">private sleutel</span> gaat nooit mee — die blijft op je eigen server, anders is het hele stelsel waardeloos.",
 cf:["7j","7a"]}
);

/* ---- H8 Toepassingen ---- */
CARDS.push(
{id:"8a",ch:8,t:"TLS-handshake",g:G.S,
 q:"Wat is het resultaat van de TLS-handshake?",
 o:["Beide partijen hebben dezelfde symmetrische sessiesleutel zonder die verstuurd te hebben",
    "De server kent de private sleutel van de client",
    "Alle data wordt vanaf dan asymmetrisch versleuteld",
    "De client heeft een certificaat van de CA gekregen"],a:0,
 w:"De handshake bestaat om één ding: een gedeelde <b>sessiesleutel</b> tot stand brengen. Daarna gaat álle data er symmetrisch overheen, want dat is duizend keer sneller. Asymmetrische crypto wordt alleen in de handshake gebruikt — dit is het <b>hybride model</b> in de praktijk.",
 cf:["4f","8b"]},

{id:"8b",ch:8,t:"TLS-handshake",g:G.V,
 q:"Welke gegevens gaan tijdens een HTTPS-sessie asymmetrisch versleuteld over de lijn?",
 o:["Alleen wat nodig is om de sessiesleutel af te leiden","Alle verstuurde data",
    "Alleen de wachtwoorden","Niets, TLS is volledig symmetrisch"],a:0,
 w:"Dit is de klassieke valkuil. Asymmetrisch wordt <b>alleen in de handshake</b> gebruikt om veilig tot een sessiesleutel te komen. Vanaf dat moment is alles symmetrisch. Zou TLS al je verkeer asymmetrisch versleutelen, dan zou het web onwerkbaar traag zijn.",
 cf:["8a","4d"]},

{id:"8c",ch:8,t:"TLS-handshake",g:G.B,
 q:"Wat stuurt de client als allereerste bij het opzetten van een TLS-verbinding?",
 o:["Een lijst met algoritmen die hij ondersteunt","Zijn eigen certificaat",
    "De sessiesleutel","Zijn wachtwoord"],a:0,
 w:"De volgorde: (1) client stuurt de lijst met ondersteunde <b>cipher suites</b>, (2) de server kiest de sterkste die ze allebei kennen en stuurt zijn <b>X.509-certificaat</b> met publieke sleutel, (3) de client controleert dat certificaat en stuurt versleutelde willekeurige data, (4) beide leiden daaruit de <b>sessiesleutel</b> af, (5) de rest gaat symmetrisch.",
 cf:["8a","8d"]},

{id:"8d",ch:8,t:"TLS-handshake",g:G.A,
 q:"Waarom stuurt de server zijn certificaat en niet alleen zijn publieke sleutel?",
 o:["Een kale publieke sleutel bewijst niet van wie hij is; het certificaat legt die koppeling vast",
    "Omdat de publieke sleutel anders te groot is","Omdat het certificaat de sessiesleutel bevat",
    "Omdat de client anders niet weet welk algoritme te gebruiken"],a:0,
 w:"Zonder certificaat kan een man-in-the-middle zijn eigen publieke sleutel opsturen en alles meelezen. Het <b>certificaat</b> koppelt de sleutel via de <b>chain of trust</b> aan de domeinnaam, en dát is wat je browser controleert voordat hij het slotje toont.",
 cf:["7c","4g"]},

{id:"8e",ch:8,t:"SSH",g:G.A,
 q:"Hoe controleert SSH de identiteit van de server, anders dan TLS?",
 o:["De gebruiker vertrouwt de sleutel de eerste keer zelf en SSH onthoudt hem in known_hosts",
    "Via een CA en een chain of trust, net als TLS",
    "Via een wachtwoord dat de server terugstuurt","Via een certificaat van de systeembeheerder"],a:0,
 w:"SSH heeft standaard <b>geen CA en geen PKI</b>. De eerste keer krijg je de fingerprint te zien en beslis je zelf — <i>trust on first use</i>. Daarna staat de sleutel in <code>~/.ssh/known_hosts</code> en waarschuwt SSH luid als hij ineens verandert. Zwakker bij de eerste verbinding, maar zonder afhankelijkheid van CA's.",
 cf:["7c","8f"]},

{id:"8f",ch:8,t:"SSH",g:G.A,
 q:"SSH waarschuwt dat de host key van een bekende server is veranderd. Wat betekent dat?",
 o:["Óf de server is opnieuw geïnstalleerd, óf iemand zit ertussen",
    "Het certificaat is verlopen","Je wachtwoord is verkeerd",
    "De verbinding is niet versleuteld"],a:0,
 w:"De sleutel in <code>known_hosts</code> komt niet meer overeen. Dat kan onschuldig zijn (herinstallatie), maar het is precies wat je ook zou zien bij een <b>man-in-the-middle</b>. Daarom mag je die waarschuwing nooit wegklikken zonder de nieuwe fingerprint <b>out-of-band</b> te verifiëren.",
 cf:["8e","7h"]},

{id:"8g",ch:8,t:"Code signing",g:G.O,
 q:"Wat is het doel van code signing?",
 o:["Aantonen dat software van de opgegeven maker komt en niet gewijzigd is",
    "De broncode geheimhouden","De software sneller laten draaien",
    "Voorkomen dat de software gekopieerd wordt"],a:0,
 w:"<b>Code signing</b> geeft <b>integriteit</b> (de code is onderweg niet aangepast), <b>authenticatie</b> (hij komt van deze uitgever) en <b>onweerlegbaarheid</b>. Het geeft géén <b>vertrouwelijkheid</b>: de code blijft gewoon leesbaar. En het zegt niets over of de software goed of kwaadaardig is — alleen wie hem gemaakt heeft.",
 cf:["5m","8h"]},

{id:"8h",ch:8,t:"Code signing",g:G.I,
 q:"In een ondertekende jar staan MANIFEST.MF, THEOBALD.SF en THEOBALD.RSA. Hoe verifieert jarsigner?",
 o:["In omgekeerde volgorde: eerst het certificaat, dan de handtekening, dan het manifest, dan de bestanden",
    "In dezelfde volgorde als bij het ondertekenen",
    "Alleen het manifest, de rest is optioneel","Door de jar opnieuw te ondertekenen en te vergelijken"],a:0,
 w:"Ondertekenen bouwt op: het <b>manifest</b> krijgt per bestand een hash, het <code>.SF</code>-bestand hasht het manifest, en het <code>.RSA</code>-bestand bevat de handtekening plus het certificaat. Verifiëren gaat <b>precies andersom</b>: certificaat via de chain of trust, dan de handtekening over het SF-bestand, dan de manifesthashes, dan pas de bestanden zelf.",
 cf:["8g","7c"]},

{id:"8i",ch:8,t:"Code signing",g:G.O,
 q:"Waarvoor dient een timestamp van een Time Stamping Authority bij ondertekende code?",
 o:["Vastleggen dat er getekend is toen het certificaat nog geldig was",
    "De software van een vervaldatum voorzien","De ondertekening versnellen",
    "De private sleutel te vernieuwen"],a:0,
 w:"Certificaten verlopen, maar ondertekende software blijft in omloop. Een <b>TSA</b> zet er een betrouwbare, zelf ondertekende tijdstempel op. Zo blijft de handtekening geldig na de vervaldatum, en kan een aanvaller met een gestolen sleutel niet doen alsof hij vroeger tekende.",
 cf:["8h","7i"]},

{id:"8j",ch:8,t:"Schijfversleuteling",g:G.S,
 q:"Waarom versleutel je een schijf niet direct met de sleutel die uit het wachtwoord volgt?",
 o:["Dan zou je bij elke wachtwoordwijziging de hele schijf opnieuw moeten versleutelen",
    "Dan zou de schijf te traag worden","Dan zou het wachtwoord op de schijf komen te staan",
    "Dat kan technisch niet"],a:0,
 w:"Er zit een <b>masterkey</b> tussen: de schijf wordt met die masterkey versleuteld, en de masterkey zelf wordt versleuteld met de sleutel uit je wachtwoord. Wijzig je je wachtwoord, dan hoef je alleen dat kleine pakketje opnieuw te versleutelen. Dat maakt ook meerdere gebruikers op één schijf mogelijk — elk met een eigen kopie van dezelfde masterkey.",
 cf:["8k"]},

{id:"8k",ch:8,t:"Schijfversleuteling",g:G.V,
 q:"Waartegen beschermt schijfversleuteling wél en waartegen niet?",
 o:["Wel tegen diefstal van het apparaat, niet tegen aanvallen terwijl je ingelogd bent",
    "Tegen alles, zolang het wachtwoord sterk is","Alleen tegen virussen",
    "Alleen tegen netwerkaanvallen"],a:0,
 w:"Staat het apparaat uit, dan is de schijf een blok ruis — <b>vertrouwelijkheid bij verlies of diefstal</b>. Maar zodra je bent ingelogd, is alles ontsleuteld en gewoon leesbaar voor alles wat op je systeem draait. Schijfversleuteling beschermt data <i>at rest</i>, niet data <i>in use</i>.",
 cf:["8j"]}
);

/* ---- H9 Authenticatie en autorisatie ---- */
CARDS.push(
{id:"9a",ch:9,t:"Identificatie",g:G.A,
 q:"Wat is het verschil tussen identificatie en authenticatie?",
 o:["Identificatie is claimen wie je bent, authenticatie is die claim bewijzen",
    "Identificatie is bewijzen, authenticatie is claimen",
    "Ze betekenen hetzelfde","Identificatie bepaalt wat je mag, authenticatie wie je bent"],a:0,
 w:"Je gebruikersnaam intikken is <b>identificatie</b>: een claim. Je wachtwoord erbij is <b>authenticatie</b>: het bewijs. Vergelijk het met je naam noemen aan de balie tegenover je paspoort laten zien. Een claim zonder bewijs stelt niets voor.",
 cf:["9b"]},

{id:"9b",ch:9,t:"Autorisatie",g:G.B,
 q:"Wat regelt autorisatie?",
 o:["Wat een geauthenticeerde gebruiker mag doen","Wie de gebruiker is",
    "Hoe de gebruiker zijn identiteit bewijst","Of het verkeer versleuteld is"],a:0,
 w:"<b>Autorisatie</b> komt ná authenticatie en gaat over <b>rechten</b>: welke bestanden mag je lezen, welke knoppen zie je. Je kunt perfect geauthenticeerd zijn en toch nergens bij mogen. Onthoud de volgorde: identificatie (wie zeg je dat je bent) → authenticatie (bewijs) → autorisatie (wat mag je).",
 cf:["9a","11a"]},

{id:"9c",ch:9,t:"Autorisatie",g:G.B,
 q:"Een systeem herkent je wel maar geeft geen toegang tot een map. Wat gaat er mis?",
 o:["De autorisatie, niet de authenticatie","De authenticatie",
    "De identificatie","De versleuteling"],a:0,
 w:"Herkennen lukte — dus identificatie en authenticatie zijn geslaagd. Wat ontbreekt zijn de <b>rechten</b>: dat is <b>autorisatie</b>. In de praktijk zie je dat als het verschil tussen een 401 (niet ingelogd) en een 403 (wel ingelogd, mag niet).",
 cf:["9b","11a"]}
);

/* ---- H10 Authenticatie ---- */
CARDS.push(
{id:"10a",ch:10,t:"Factoren",g:G.A,
 q:"Welke drie klassen van authenticatiefactoren zijn er?",
 o:["Iets dat je weet, iets dat je bezit, iets dat je bent",
    "Iets dat je weet, iets dat je ziet, iets dat je zegt",
    "Wachtwoord, pincode, wachtwoordzin","Kennis, autorisatie, identificatie"],a:0,
 w:"<b>Weten</b> (wachtwoord, pincode), <b>bezitten</b> (telefoon, token, pas) en <b>zijn</b> (vingerafdruk, gezicht, iris). Elke klasse faalt op een andere manier: kennis lekt uit, bezit raak je kwijt, biometrie kun je niet vervangen als hij eenmaal gekopieerd is.",
 cf:["10b"]},

{id:"10b",ch:10,t:"Factoren",g:G.A,
 q:"Inloggen met een wachtwoord én daarna een pincode: hoeveel factoren zijn dat?",
 o:["Eén factor","Twee factoren","Drie factoren","Geen enkele factor"],a:0,
 w:"Allebei zijn ze <b>iets dat je weet</b>, dus het is <b>één</b> factor — twee keer. Voor echte <b>tweefactorauthenticatie</b> moeten de factoren uit <b>verschillende klassen</b> komen én <b>onafhankelijk</b> zijn. Een code die naar hetzelfde toestel gaat waarop je inlogt, is daarom zwakker dan het lijkt.",
 cf:["10a","10j"]},

{id:"10c",ch:10,t:"Wachtwoordsterkte",g:G.A,
 q:"Waarom is 'correcthorsebatterystaple' sterker dan 'Tr0ub4dor&3'?",
 o:["Het is veel langer, en lengte levert meer entropie op dan tekensubstituties",
    "Het bevat geen cijfers en is daarom moeilijker te raden",
    "Het staat niet in het woordenboek","Het is korter en dus sneller te typen"],a:0,
 w:"Aanvallers proberen niet letter voor letter, maar met woordenlijsten en de bekende trucs (a→4, o→0). Die substituties leveren nauwelijks <b>entropie</b> op. Vier willekeurig gekozen woorden uit een lijst van 2048 geven 4 × 11 = 44 bits — én zijn beter te onthouden. Lengte verslaat complexiteit.",
 cf:["2g","10d"]},

{id:"10d",ch:10,t:"Brute force",g:G.A,
 q:"Wat is de meest effectieve maatregel tegen het online uitproberen van wachtwoorden?",
 o:["Een oplopende wachttijd na elke mislukte poging",
    "Wachtwoorden elke maand laten wijzigen","Alleen cijfers toestaan",
    "De gebruikersnaam geheimhouden"],a:0,
 w:"Een <b>oplopende vertraging</b> (of tijdelijke blokkade) maakt het aantal pogingen per uur zo klein dat brute force zinloos wordt, zonder dat een echte gebruiker met een typefout buitengesloten raakt. Verplicht periodiek wijzigen werkt averechts: mensen maken er dan <i>Zomer2026!</i> van.",
 cf:["10c","10e"]},

{id:"10e",ch:10,t:"Wachtwoordaanvallen",g:G.A,
 q:"Wat is credential stuffing?",
 o:["Elders gelekte gebruikersnaam-wachtwoordparen massaal uitproberen op andere sites",
    "Een wachtwoordveld overladen met te veel tekens",
    "Hashes vergelijken met een rainbow table","Een wachtwoord raden op basis van persoonlijke gegevens"],a:0,
 w:"Omdat mensen wachtwoorden hergebruiken, is één gelekte database genoeg om overal in te breken. De aanvaller hoeft niets te kraken; hij probeert werkende combinaties. Vandaar het advies: voor elke dienst een uniek wachtwoord, plus tweefactor. Dít is waarom hergebruik zo gevaarlijk is.",
 cf:["5f","10d"]},

{id:"10f",ch:10,t:"Challenge-response",g:G.A,
 q:"Wat is het voordeel van challenge-response boven het versturen van een wachtwoord?",
 o:["Het geheim gaat nooit over de lijn, dus afluisteren levert niets bruikbaars op",
    "Het is sneller","Er is geen sleutel nodig","De server hoeft niets op te slaan"],a:0,
 w:"De server stuurt een <b>challenge</b> — iets onvoorspelbaars — en jij bewijst met je geheim dat je het antwoord kunt berekenen. Het geheim zelf verlaat je nooit, en omdat de challenge elke keer anders is, kan een afluisteraar het antwoord niet hergebruiken (<b>replay</b>).",
 cf:["10g","10h"]},

{id:"10g",ch:10,t:"SSH-sleutelauthenticatie",g:G.A,
 q:"Hoe bewijst de client zich bij SSH-authenticatie met een sleutelpaar?",
 o:["De server versleutelt willekeurige data met de publieke sleutel; alleen de echte client kan die ontsleutelen",
    "De client stuurt zijn private sleutel naar de server",
    "De server stuurt zijn eigen wachtwoord ter controle",
    "Beide partijen sturen hun publieke sleutel en vergelijken"],a:0,
 w:"De publieke sleutel van de gebruiker staat op de server. Die versleutelt er iets willekeurigs mee; alleen wie de bijbehorende <span class=\"priv\">private sleutel</span> heeft, krijgt het open en kan antwoorden. Een vorm van <b>challenge-response</b>, en veiliger dan een wachtwoord omdat er nooit een geheim over de lijn gaat.",
 cf:["10f","4b"]},

{id:"10h",ch:10,t:"OTP",g:G.A,
 q:"Wat is het verschil tussen HOTP en TOTP?",
 o:["HOTP telt op met een teller, TOTP is gebaseerd op de tijd",
    "HOTP gebruikt hashing, TOTP encryptie","HOTP is asymmetrisch, TOTP symmetrisch",
    "HOTP is voor hardware, TOTP alleen voor apps"],a:0,
 w:"Allebei zijn ze een HMAC over een gedeelde sleutel plus een teller. Bij <b>HOTP</b> (RFC 4226) loopt die teller op per gebruik — de code blijft geldig tot je hem gebruikt. Bij <b>TOTP</b> (RFC 6238) is de teller de <b>tijd</b>, meestal per dertig seconden, dus de code verloopt vanzelf. De <i>T</i> van tijd is je ezelsbruggetje.",
 cf:["10i","5k"]},

{id:"10i",ch:10,t:"OTP",g:G.A,
 q:"Waarom moet je bij HOTP soms een paar codes vooruit accepteren?",
 o:["De teller van het token kan voorlopen als er codes gegenereerd zijn zonder ze te gebruiken",
    "Omdat de klok van de server kan afwijken","Omdat de sleutel verloopt",
    "Omdat de gebruiker soms typefouten maakt"],a:0,
 w:"Bij <b>HOTP</b> loopt de teller op zodra je een code opvraagt, ook als je hem niet gebruikt. Server en token raken dan uit de pas, dus de server accepteert een klein venster vooruit. Bij <b>TOTP</b> speelt dat niet — daar is het probleem juist <b>klokdrift</b>, dus wordt een venster in de tijd toegestaan.",
 cf:["10h"]},

{id:"10j",ch:10,t:"Tokens",g:G.A,
 q:"Waarom geldt een los hardwaretoken als veiliger dan een authenticator-app op je telefoon?",
 o:["Het is een apart apparaat, dus malware op je computer of telefoon komt er niet bij",
    "Het gebruikt sterkere algoritmen","De codes zijn langer",
    "Het hoeft geen sleutel te delen met de server"],a:0,
 w:"De kracht van tweefactor zit in <b>onafhankelijkheid</b>. Een <b>hardwaretoken</b> staat helemaal los; een <b>softwaretoken</b> deelt het apparaat met alles wat daar verder op draait. Log je op je telefoon in én ontvang je daar de code, dan is de tweede factor grotendeels weg — de <b>out-of-band</b>-gedachte gaat dan niet meer op.",
 cf:["10b","3c"]},

{id:"10k",ch:10,t:"Biometrie",g:G.A,
 q:"Wat is het fundamentele nadeel van biometrie als authenticatiefactor?",
 o:["Je kunt je vingerafdruk niet vervangen als hij eenmaal gekopieerd is",
    "Biometrie is nooit uniek genoeg","Het werkt alleen op moderne telefoons",
    "Het is niet te combineren met andere factoren"],a:0,
 w:"Een gelekt wachtwoord verander je; een gelekte vingerafdruk niet — die heb je je leven lang. Daar komt bij dat biometrie niet exact vergelijkt maar met een drempelwaarde werkt, dus er zijn altijd valse acceptaties en afwijzingen. Daarom is biometrie prima als gemak, maar zelden als enige factor.",
 cf:["10a"]},

{id:"10m",ch:10,t:"SSO",g:G.A,
 q:"Wat is single sign-on?",
 o:["Eén keer inloggen bij een centrale partij en daarmee toegang tot meerdere diensten",
    "Eén wachtwoord dat je overal opnieuw intikt","Inloggen met precies één factor",
    "Een wachtwoordmanager die je wachtwoorden invult"],a:0,
 w:"Bij <b>SSO</b> authenticeer je bij één <b>identity provider</b>; de aangesloten diensten vertrouwen diens uitspraak. Minder wachtwoorden, centraal in- en uitschakelen van accounts. Keerzijde: die ene inlog is een <b>single point of failure</b>, dus juist daar wil je sterke tweefactor.",
 cf:["10n","11d"]},

{id:"10n",ch:10,t:"SAML",g:G.A,
 q:"Wat doet SAML?",
 o:["Een identity provider laat via een ondertekende verklaring aan een dienst weten wie je bent",
    "Het versleutelt het verkeer tussen browser en server",
    "Het slaat wachtwoorden gehasht op","Het genereert eenmalige codes"],a:0,
 w:"<b>SAML</b> is het XML-formaat waarin een <b>IdP</b> een ondertekende <i>assertion</i> over jouw identiteit aan een <b>service provider</b> doorgeeft. Die handtekening is essentieel: daarmee weet de dienst dat de verklaring echt van de IdP komt. SURFconext werkt zo, met een <b>wayf</b>-scherm om je eigen instelling te kiezen.",
 cf:["10m","11h"]},

{id:"10o",ch:10,t:"LDAP",g:G.B,
 q:"Waarvoor wordt LDAP in een organisatie gebruikt?",
 o:["Als centrale directory met gebruikers, groepen en hun gegevens",
    "Als protocol om verkeer te versleutelen","Als algoritme om wachtwoorden te hashen",
    "Als methode om certificaten in te trekken"],a:0,
 w:"<b>LDAP</b> is de centrale gebruikersadministratie waar systemen op aansluiten: één plek voor accounts en groepen. Nauw verweven met autorisatie, want groepslidmaatschap bepaalt vaak de rechten. Neem je iemand uit dienst, dan sluit één wijziging alle deuren tegelijk.",
 cf:["10m","9b"]}
);

/* ---- H11 Autorisatie, OAuth en PKCE ---- */
CARDS.push(
{id:"11a",ch:11,t:"Toegangsrechten",g:G.B,
 q:"Wat kun je met een ACL dat met klassieke chmod-rechten niet kan?",
 o:["Rechten per individuele gebruiker of groep instellen, niet alleen voor eigenaar/groep/rest",
    "Bestanden versleutelen","Rechten automatisch laten verlopen",
    "Wachtwoorden per bestand instellen"],a:0,
 w:"<code>chmod</code> kent maar drie categorieën: eigenaar, groep, en alle anderen. Een <b>ACL</b> is een lijst met losse regels, zodat je precies één collega leestoegang kunt geven zonder een nieuwe groep aan te maken. Beide gaan over <b>autorisatie</b>: wat mag een al geauthenticeerde gebruiker.",
 cf:["9b"]},

{id:"11b",ch:11,t:"OAuth",g:G.B,
 q:"Wat is OAuth 2.0 bedoeld om te regelen?",
 o:["Autorisatie: een app namens jou beperkte toegang geven tot je gegevens bij een andere dienst",
    "Authenticatie: vaststellen wie de gebruiker is",
    "Versleuteling van het verkeer","Het veilig opslaan van wachtwoorden"],a:0,
 w:"Dit is de meest gestelde strikvraag. <b>OAuth is een autorisatieprotocol, geen authenticatieprotocol.</b> Het regelt dat een app namens jou bij je gegevens mag, zonder dat je je wachtwoord afgeeft. Wil je er inloggen mee bouwen, dan heb je de uitbreiding <b>OpenID Connect</b> nodig.",
 cf:["11c","9b"]},

{id:"11c",ch:11,t:"OAuth",g:G.A,
 q:"Waarom is een access token op zichzelf geen bewijs van iemands identiteit?",
 o:["Het zegt alleen wat er mag, niet wie het gebruikt of hoe die is ingelogd",
    "Omdat het te kort geldig is","Omdat het niet ondertekend is",
    "Omdat het over een onversleutelde verbinding gaat"],a:0,
 w:"Een <b>access token</b> is een sleutel, geen paspoort: wie hem heeft, mag wat erop staat. Bouw je login op de enkele constatering <i>ik kreeg een geldig token</i>, dan werkt een gestolen of elders verkregen token net zo goed. Daarvoor bestaat het <b>id_token</b> van OpenID Connect, dat wél over de gebruiker gaat.",
 cf:["11b","11f"]},

{id:"11d",ch:11,t:"OAuth-rollen",g:G.B,
 q:"Wie is de resource owner in OAuth?",
 o:["De gebruiker aan wie de gegevens toebehoren","De app die toegang vraagt",
    "De server waar de gegevens staan","De partij die de tokens uitgeeft"],a:0,
 w:"De <b>resource owner</b> ben jij — jij bezit de gegevens en geeft toestemming. De <b>client</b> is de app die iets wil, de <b>authorization server</b> geeft na jouw toestemming tokens uit, en de <b>resource server</b> (web-API) levert de data op vertoon van een geldig token.",
 cf:["11e","11b"]},

{id:"11e",ch:11,t:"OAuth-endpoints",g:G.B,
 q:"Wat is het verschil tussen het authorization endpoint en het token endpoint?",
 o:["Op het eerste geeft de gebruiker toestemming in de browser, op het tweede ruilt de app de code om voor tokens",
    "Het eerste is voor mobiel, het tweede voor web",
    "Het eerste geeft tokens uit, het tweede codes",
    "Er is geen verschil, het zijn twee namen voor hetzelfde"],a:0,
 w:"Naar <code>/oauth2/authorize</code> wordt de <b>gebruiker</b> gestuurd: daar logt hij in en geeft toestemming, met als resultaat een <b>authorization code</b> in de redirect. Naar <code>/oauth2/token</code> praat de <b>app</b> rechtstreeks (back-channel) om die code in te wisselen voor een <b>access token</b>. Twee kanalen, met opzet gescheiden.",
 cf:["11f","11g"]},

{id:"11f",ch:11,t:"OAuth-tokens",g:G.S,
 q:"Waarom krijgt de app eerst een authorization code en niet meteen een access token?",
 o:["De code gaat via de browser en is kortlevend en eenmalig; het token gaat via een direct kanaal",
    "Omdat het token dan te lang zou worden",
    "Omdat de gebruiker de code moet overtypen","Omdat de code langer geldig is dan het token"],a:0,
 w:"De redirect via de browser is zichtbaar: in de adresbalk, in logs, in de geschiedenis. Daarom gaat daar alleen een <b>authorization code</b> overheen — eenmalig en maximaal een minuut of tien geldig. Het echte <b>access token</b> wordt over een directe server-naar-serververbinding opgehaald, buiten het zicht van de browser.",
 cf:["11e","11h"]},

{id:"11g",ch:11,t:"OAuth-tokens",g:G.S,
 q:"Waarvoor dient een refresh token?",
 o:["Een nieuw access token ophalen zonder de gebruiker opnieuw lastig te vallen",
    "Het wachtwoord van de gebruiker vernieuwen","De sessiesleutel verversen",
    "Het certificaat van de server controleren"],a:0,
 w:"<b>Access tokens</b> zijn expres kortlevend, zodat een gelekt token snel waardeloos is. Met een <b>refresh token</b> haalt de app stilletjes een nieuw exemplaar op. Dat maakt het refresh token juist waardevoller en gevoeliger — het wordt daarom alleen aan de vertrouwde back-end gegeven, nooit aan browsercode.",
 cf:["11f"]},

{id:"11h",ch:11,t:"PKCE",g:G.S,
 q:"Waartegen beschermt PKCE?",
 o:["Tegen een aanvaller die de authorization code onderschept en zelf inwisselt",
    "Tegen het afluisteren van het access token","Tegen zwakke wachtwoorden",
    "Tegen een verlopen certificaat"],a:0,
 w:"Op mobiel komt de redirect binnen via een URL-handler, en een kwaadaardige app kan zich voor diezelfde handler registreren en de <b>authorization code</b> opvangen. <b>PKCE</b> (RFC 7636) maakt die code op zichzelf waardeloos: zonder het bijbehorende geheim krijgt de dief er geen token voor.",
 cf:["11i","11f"]},

{id:"11i",ch:11,t:"PKCE",g:G.S,
 q:"Hoe werkt PKCE technisch?",
 o:["De app verzint een code_verifier, stuurt de SHA-256 daarvan mee, en bewijst bij het inwisselen dat hij het origineel heeft",
    "De app versleutelt de code met de publieke sleutel van de server",
    "De app ondertekent de code met zijn private sleutel",
    "De server stuurt een tweede code via een ander kanaal"],a:0,
 w:"De app maakt een willekeurige <b>code_verifier</b> en stuurt bij de autorisatieaanvraag alleen de hash mee: de <b>code_challenge</b>. Bij het inwisselen stuurt hij de verifier zelf. De server hasht en vergelijkt. Wie alleen de code onderschept, mist de verifier. Let op: alleen <code>S256</code> (SHA-256) telt als veilig; <code>plain</code> is zinloos.",
 cf:["11h","5b"]},

{id:"11j",ch:11,t:"OAuth",g:G.S,
 q:"Waarom is een client_secret ongeschikt voor een mobiele app of single-page app?",
 o:["Die code staat op het apparaat van de gebruiker en is dus uit te lezen",
    "Omdat het secret te lang is voor mobiel","Omdat mobiele apps geen HTTPS gebruiken",
    "Omdat het secret elke dag verandert"],a:0,
 w:"Alles wat je meelevert in een app of in browsercode kan worden uitgelezen — dan is het geen geheim meer. Zulke <b>public clients</b> hebben daarom geen client_secret maar gebruiken <b>PKCE</b>: het geheim wordt per keer verzonnen en verlaat het apparaat nooit.",
 cf:["11i","11h"]},

{id:"11k",ch:11,t:"OAuth",g:G.V,
 q:"Wat is het voordeel van OAuth boven een app je wachtwoord geven?",
 o:["De app krijgt beperkte, intrekbare toegang zonder je wachtwoord te kennen",
    "De app werkt daardoor sneller","Je wachtwoord wordt sterker versleuteld",
    "Je hoeft niet meer in te loggen"],a:0,
 w:"Geef je je wachtwoord, dan kan de app <b>alles</b> wat jij kunt, voor altijd, ook je wachtwoord wijzigen. Met OAuth krijgt hij een token met een afgebakende <b>scope</b>, dat je op elk moment kunt intrekken zonder je wachtwoord te veranderen. Dat is precies het probleem dat OAuth is komen oplossen.",
 cf:["11b","11g"]}
);

{id:"12b",ch:12,t:"Bronnen",g:G.B,

);
