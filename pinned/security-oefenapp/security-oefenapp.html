 o:["De tijd is te raden, dus de aanvaller reconstrueert de sleutel",
    "De tijd verandert te snel om een stabiele sleutel te leveren",
    "De tijd levert te weinig cijfers voor een sleutel van 128 bits",
    "De tijd verschilt per tijdzone en dus per server van de dienst"],a:0,
 w:"Een aanvaller die weet dat je rond 20:14 inlogde, hoeft maar een klein aantal seeds te proberen. De sleutel lijkt 128 bits lang, maar de <b>entropie</b> is misschien 20 bits. Gebruik een <b>CSPRNG</b> zoals <code>/dev/random</code>, die put uit onvoorspelbare fysieke bronnen."},

{id:"x2d",ch:2,t:"Sleutelsterkte",g:G.S,mo:1,
 q:"Een sleutel van 256 bits wordt afgeleid uit een wachtwoord met 40 bits entropie. Hoe sterk is die sleutel?",
 o:["Ongeveer 39 bits","Precies 256 bits","Ongeveer 296 bits","Ongeveer 128 bits"],a:0,
 w:"De sterkte wordt bepaald door de zwakste schakel: de <b>entropie van de bron</b>, niet de lengte van het resultaat. Met 40 bits entropie ben je gemiddeld na 2³⁹ pogingen binnen. Een lange sleutel afleiden uit een zwak wachtwoord maakt hem niet sterker — alleen langer."},

/* ---- H3 ---- */
{id:"x3a",ch:3,t:"Sleuteluitwisseling",g:G.S,mo:1,
 q:"Tien mensen willen elkaar onderling symmetrisch versleuteld schrijven. Hoeveel verschillende sleutels zijn er nodig?",
 o:["45","10","20","100"],a:0,
 w:"Elk paar heeft een eigen sleutel: 10 × 9 / 2 = <b>45</b>. Dit is het <b>sleutelbeheerprobleem</b> van symmetrische crypto — het aantal sleutels groeit kwadratisch. Bij asymmetrisch heeft iedereen één sleutelpaar, dus tien paren en klaar."},

{id:"x3b",ch:3,t:"Sleuteluitwisseling",g:G.S,mo:1,
 q:"Je mailt iemand een versleuteld zip-bestand en stuurt het wachtwoord in een tweede mail na. Wat is er mis?",
 o:["Beide berichten gaan over hetzelfde kanaal, dus dit is niet out-of-band",
    "Het wachtwoord raakt bekend doordat het tweemaal verzonden wordt",
    "Een zip-bestand is technisch ongeschikt voor sterke versleuteling",
    "Het wachtwoord moet altijd vóór het bestand verstuurd worden"],a:0,
 w:"<b>Out-of-band</b> gaat over een <i>ander kanaal</i>, niet over een ander moment of een ander bericht. Wie de mailbox meeleest, ziet beide mails. Bel het wachtwoord door, app het, of geef het persoonlijk."},

/* ---- H4 ---- */
{id:"x4a",ch:4,t:"Sleutelrichting",g:G.V,mo:1,
 q:"Je wilt dat alleen Bob je bericht kan lezen én dat Bob zeker weet dat het van jou komt. Wat doe je?",
 o:["Ondertekenen met jouw private sleutel, versleutelen met Bobs publieke",
    "Ondertekenen met Bobs publieke sleutel, versleutelen met jouw private",
    "Ondertekenen met jouw publieke sleutel, versleutelen met Bobs private",
    "Ondertekenen met Bobs private sleutel, versleutelen met jouw publieke"],a:0,
 w:"Twee doelen, twee handelingen. <b>Vertrouwelijkheid</b>: versleutelen met de <span class=\"pub\">publieke sleutel van de ontvanger</span>, want alleen hij heeft de bijbehorende private. <b>Authenticatie</b>: ondertekenen met je <span class=\"priv\">eigen private sleutel</span>, want alleen jij hebt die. De vuistregel: versleutelen doe je naar de ander toe, ondertekenen doe je vanuit jezelf.",
 cf:["4b","4c"]},

{id:"x4b",ch:4,t:"Trapdoor",g:G.B,mo:1,
 q:"Wat maakt een functie geschikt als trapdoor voor asymmetrische crypto?",
 o:["Eenvoudig in één richting, onhaalbaar terug zonder extra gegeven",
    "Eenvoudig in beide richtingen, mits je het algoritme kent",
    "Onhaalbaar in beide richtingen, ook met de juiste sleutel",
    "Eenvoudig terug te rekenen, maar traag in de voorwaartse richting"],a:0,
 w:"Een <b>trapdoor</b> is eenrichtingsverkeer met een geheime achterdeur. Vermenigvuldigen van twee priemgetallen kost niets; het product ontbinden is onhaalbaar — tenzij je één van de factoren al kent. Dat 'extra gegeven' is de private sleutel."},

{id:"x4c",ch:4,t:"Hybride model",g:G.S,mo:1,
 q:"Waarom versleutelt TLS niet gewoon alle data asymmetrisch?",
 o:["Asymmetrisch is duizenden malen trager dan symmetrisch werken",
    "Asymmetrisch kan alleen tekst aan en geen binaire gegevens",
    "Asymmetrisch biedt geen enkele bescherming van de integriteit",
    "Asymmetrisch vereist dat beide partijen een certificaat hebben"],a:0,
 w:"Snelheid. Asymmetrische crypto is ongeveer duizend keer trager en levert langere cryptotekst op. Daarom gebruikt het <b>hybride model</b> asymmetrisch alleen om een symmetrische <b>sessiesleutel</b> af te spreken, en gaat de rest van het verkeer symmetrisch."},

/* ---- H5 ---- */
{id:"x5a",ch:5,t:"Doelen-tabel",g:G.A,mo:1,
 q:"Twee servers delen een geheime sleutel en hangen aan elk bericht een HMAC. Wat leveren zij daarmee op?",
 o:["Integriteit en authenticatie, maar geen onweerlegbaarheid",
    "Integriteit en onweerlegbaarheid, maar geen authenticatie",
    "Integriteit, authenticatie en ook onweerlegbaarheid",
    "Alleen integriteit, want er is geen sleutelpaar gebruikt"],a:0,
 w:"Beide servers hebben <i>dezelfde</i> sleutel, dus beide kunnen elke geldige HMAC maken. Tegenover een derde valt daarom niet te bewijzen wie het bericht opstelde — geen <b>onweerlegbaarheid</b>. Daarvoor heb je een asymmetrische <b>handtekening</b> nodig.",
 cf:["5j","5n"]},

{id:"x5b",ch:5,t:"Salt",g:G.V,mo:1,
 q:"In een gelekte database hebben twee gebruikers exact dezelfde wachtwoordhash. Wat weet je?",
 o:["Er is geen salt gebruikt, en zij hebben hetzelfde wachtwoord",
    "Er is wel een salt gebruikt, maar die is voor beiden gelijk gekozen",
    "Zij hebben verschillende wachtwoorden met een toevallige collisie",
    "De hashfunctie is verouderd en levert te weinig unieke waarden"],a:0,
 w:"Met een <b>salt per gebruiker</b> krijgen gelijke wachtwoorden verschillende hashes — dat is precies het doel. Gelijke hashes verraden dus dat er geen (of een gedeelde) salt is. Een echte collisie is bij een veilige hashfunctie astronomisch onwaarschijnlijk; ga daar nooit van uit.",
 cf:["5g","5h"]},

{id:"x5c",ch:5,t:"Collisie",g:G.I,mo:1,
 q:"Waarom is een collisie-aanval gevaarlijk bij digitale handtekeningen?",
 o:["Een tweede document met dezelfde hash erft dezelfde handtekening",
    "De private sleutel is uit de hash van het document af te leiden",
    "De handtekening wordt door de collisie onleesbaar voor de ontvanger",
    "De ontvanger kan de hash van het document niet meer berekenen"],a:0,
 w:"Je ondertekent de <b>hash</b>, niet het document. Kan een aanvaller een tweede document maken met dezelfde hash, dan geldt jouw handtekening ook daarvoor — en dat is bij MD5 in de praktijk gedaan. Vandaar dat MD5 en SHA-1 zijn afgeschreven."},

{id:"x5d",ch:5,t:"Wachtwoordopslag",g:G.V,mo:1,
 q:"Welke opslagwijze voor wachtwoorden is het meest verantwoord?",
 o:["Gehasht met een salt en een bewust trage hashfunctie",
    "Versleuteld met AES-256 en een goed bewaarde sleutel",
    "Gehasht met SHA-256 zonder salt, maar wel dubbel toegepast",
    "Gehasht met een salt en een zo snel mogelijke hashfunctie"],a:0,
 w:"Drie ingrediënten: <b>hashen</b> (geen sleutel die gestolen kan worden), <b>salt</b> (geen rainbow tables, gelijke wachtwoorden hashen verschillend) en <b>traagheid</b> (elke gokpoging van de aanvaller kost tijd). Snelheid is bij wachtwoorden juist een zwakte, niet een voordeel."},

{id:"x5e",ch:5,t:"MAC",g:G.O,mo:1,
 q:"Waarom is een MAC ongeschikt als bewijs in een geschil tussen twee partijen?",
 o:["Beide partijen kennen de sleutel, dus beide konden het bericht maken",
    "Een MAC is te kort om als juridisch bewijsstuk te kunnen dienen",
    "Een MAC verloopt na verloop van tijd en is daarna niet te toetsen",
    "Beide partijen kennen de sleutel, dus geen van beide kan verifiëren"],a:0,
 w:"Dit is de kern van <b>onweerlegbaarheid</b>. Een gedeelde sleutel betekent een gedeelde mogelijkheid: als Alice een geldige MAC kan maken, kan Bob dat ook, dus geen rechter kan uitmaken wie het was. Alleen een <b>private sleutel</b> die niemand anders heeft, levert bewijs.",
 cf:["5j","1b"]},

{id:"x5f",ch:5,t:"Digitale handtekening",g:G.O,mo:1,
 q:"Hoe controleert de ontvanger een digitale handtekening?",
 o:["Handtekening openen met de publieke sleutel en met de eigen hash vergelijken",
    "Handtekening openen met de private sleutel en met de eigen hash vergelijken",
    "Document hashen en die hash met de publieke sleutel van de zender versleutelen",
    "Document hashen en die hash met de gedeelde geheime sleutel vergelijken"],a:0,
 w:"Twee bewerkingen die op hetzelfde moeten uitkomen: (1) de meegestuurde handtekening ontsleutelen met de <span class=\"pub\">publieke sleutel van de zender</span> — dat levert de hash op die híj berekende; (2) zelf het document hashen. Gelijk? Dan is het document onveranderd én komt het van de houder van de private sleutel.",
 cf:["5m"]},

{id:"x5g",ch:5,t:"Collisie",g:G.I,mo:1,
 q:"SHA-256 levert 2²⁵⁶ mogelijke uitvoerwaarden. Wat volgt daaruit over collisies?",
 o:["Ze bestaan gegarandeerd, maar zijn niet doelgericht te vinden",
    "Ze bestaan niet, omdat 2²⁵⁶ meer is dan er invoeren bestaan",
    "Ze bestaan alleen bij invoeren die langer zijn dan 256 bits",
    "Ze bestaan gegarandeerd en zijn met genoeg rekenkracht te maken"],a:0,
 w:"Het <b>duiventilprincipe</b>: oneindig veel mogelijke invoeren, eindig veel uitvoerwaarden, dus collisies moeten bestaan. Cryptografisch veilig betekent niet 'geen collisies', maar 'je kunt er geen vinden of construeren'. Bij MD5 lukt dat inmiddels wel, bij SHA-256 niet."},

/* ---- H6 ---- */
{id:"x6a",ch:6,t:"Algoritmen",g:G.B,mo:1,
 q:"Wat voor soort algoritme is SHA-1 en wat is de status?",
 o:["Een hashfunctie, afgeschreven wegens collisie-aanvallen",
    "Een hashfunctie, nog actueel voor niet-kritische toepassingen",
    "Een symmetrisch algoritme, afgeschreven wegens korte sleutels",
    "Een asymmetrisch algoritme, afgeschreven wegens trage werking"],a:0,
 w:"SHA-1 is een <b>hashfunctie</b> en sinds 2017 (SHAttered) praktisch gebroken: er zijn echte collisies aangetoond. Niet meer gebruiken voor handtekeningen of certificaten. Opvolger: <b>SHA-256</b>."},

{id:"x6b",ch:6,t:"Algoritmen",g:G.B,mo:1,
 q:"Wat voor soort algoritme is 3DES en wat is de status?",
 o:["Symmetrisch, legacy: alleen nog in bestaande systemen",
    "Symmetrisch, actueel: nog steeds de aanbevolen standaard",
    "Asymmetrisch, legacy: alleen nog in bestaande systemen",
    "Een hashfunctie, legacy: vervangen door de SHA-familie"],a:0,
 w:"3DES is <b>symmetrisch</b>: DES driemaal toegepast om de te korte sleutel te compenseren. Het werkt nog, maar is traag en heeft een effectieve sterkte van 112 bits. Status: <b>legacy</b> — niet fout in oude systemen, wel fout in een nieuw ontwerp. Kies AES."},

{id:"x6c",ch:6,t:"Algoritmen",g:G.B,mo:1,
 q:"Wat voor soort algoritme is RC4 en wat is de status?",
 o:["Symmetrisch, afgeschreven wegens aantoonbare zwakheden",
    "Symmetrisch, actueel voor toepassingen die snelheid vragen",
    "Asymmetrisch, afgeschreven wegens te korte sleutellengtes",
    "Een hashfunctie, afgeschreven wegens gevonden collisies"],a:0,
 w:"RC4 is een <b>symmetrische</b> stroomvercijfering, ooit populair in WEP en TLS, inmiddels <b>afgeschreven</b>: de uitvoer is statistisch niet willekeurig genoeg en daardoor aanvalbaar. Snelheid is nooit een reden om een gebroken algoritme te kiezen."},

{id:"x6d",ch:6,t:"Algoritmen",g:G.B,mo:1,
 q:"Welke rij bevat uitsluitend symmetrische algoritmen?",
 o:["AES, Blowfish, Twofish","AES, RSA, Twofish",
    "AES, Blowfish, SHA-256","DSA, Blowfish, Twofish"],a:0,
 w:"<b>Symmetrisch</b>: DES, 3DES, AES (Rijndael), RC4, Blowfish, Twofish. <b>Asymmetrisch</b>: RSA, DSA, ECDSA, Curve25519. <b>Hash</b>: MD5, SHA-0/1/256. Deze indeling moet je uit je hoofd kennen — de afleiders op het tentamen bestaan uit één verkeerd item in een verder kloppende rij."},

/* ---- H7 ---- */
{id:"x7a",ch:7,t:"Chain of trust",g:G.A,mo:1,
 q:"Je browser meldt: 'certificaat ondertekend door een onbekende autoriteit'. Wat is er aan de hand?",
 o:["De keten eindigt niet bij een root die het systeem al vertrouwt",
    "Het certificaat is verlopen en daardoor niet meer te controleren",
    "De publieke sleutel in het certificaat is te kort voor de browser",
    "De domeinnaam in het certificaat komt niet overeen met de site"],a:0,
 w:"De <b>chain of trust</b> loopt van het servercertificaat via eventuele tussencertificaten omhoog naar een <b>root</b>. Eindigt die keten bij iets dat niet in de vertrouwde opslag staat — een zelfgemaakte CA, of een ontbrekend tussencertificaat — dan breekt de keten. Verlopen en naamverschil geven elk een ándere melding."},

{id:"x7b",ch:7,t:"Certificaat",g:G.A,mo:1,
 q:"Een intern systeem gebruikt een self-signed certificaat. Wat betekent dat voor de beveiliging?",
 o:["Het verkeer is versleuteld, maar de identiteit is door niemand bevestigd",
    "Het verkeer is onversleuteld, en de identiteit is door niemand bevestigd",
    "Het verkeer is versleuteld, en de identiteit is door de server bevestigd",
    "Het verkeer is versleuteld, maar alleen binnen het eigen netwerk geldig"],a:0,
 w:"Self-signed wil zeggen: ondertekend met de eigen private sleutel, dus de handtekening bewijst niets over wie je voor je hebt. De <b>versleuteling</b> werkt gewoon — maar tegen een man-in-the-middle helpt zij niet, want die kan net zo goed een eigen self-signed certificaat aanbieden."},

{id:"x7c",ch:7,t:"OpenSSL-bestanden",g:G.S,mo:1,
 q:"Welk bestand mag je onder geen beding met de CA of met anderen delen?",
 o:["Het .key-bestand met de private sleutel",
    "Het .csr-bestand met de aanvraaggegevens",
    "Het .crt-bestand met het certificaat zelf",
    "Het .pem-bestand met de publieke sleutel"],a:0,
 w:"De <b>private sleutel</b> (.key) verlaat je server nooit. Een <b>CSR</b> bevat juist alleen je publieke sleutel plus je gegevens en is bedoeld om verstuurd te worden. Het certificaat (.crt) is publiek — dat deelt je server bij elke verbinding met iedereen."},

{id:"x7d",ch:7,t:"Intrekken",g:G.A,mo:1,
 q:"De private sleutel van een webserver is gelekt. Wat moet er gebeuren?",
 o:["Certificaat intrekken en een nieuw sleutelpaar met certificaat aanvragen",
    "Certificaat intrekken en het bestaande sleutelpaar opnieuw laten tekenen",
    "Wachten tot het certificaat verloopt en dan een nieuw paar aanvragen",
    "Alleen het wachtwoord op de private sleutel wijzigen bij de server"],a:0,
 w:"Een gelekte private sleutel maakt het certificaat waardeloos: iedereen met die sleutel kan zich als jouw server voordoen. Beide stappen zijn nodig — <b>intrekken</b> (revoke), zodat browsers het oude certificaat afwijzen, én een <b>nieuw sleutelpaar</b>, want het oude is besmet."},

{id:"x7e",ch:7,t:"Certificaattypen",g:G.A,mo:1,
 q:"Een bank wil dat bezoekers kunnen zien dat de site echt van de bank is. Welk certificaat past?",
 o:["EV, want daarbij wordt de organisatie zelf geverifieerd",
    "DV, want daarbij wordt het domein onweerlegbaar vastgesteld",
    "EV, want daarbij worden sterkere sleutels voorgeschreven",
    "DV, want daarbij controleert de CA ook de bedrijfsgegevens"],a:0,
 w:"<b>DV</b> (Domain Validation) bewijst alleen dat de aanvrager het domein beheert. <b>OV</b> en <b>EV</b> gaan verder: de CA controleert of de organisatie echt bestaat en de aanvrager erbij hoort. De sleutels zijn bij alle drie even sterk — het verschil zit in de <i>controle</i>, niet in de crypto."},

/* ---- H8 ---- */
{id:"x8a",ch:8,t:"TLS-handshake",g:G.S,mo:1,
 q:"In welke volgorde verloopt een TLS-handshake?",
 o:["Client hello, certificaat, sessiesleutel afspreken, versleuteld verder",
    "Certificaat, client hello, sessiesleutel afspreken, versleuteld verder",
    "Client hello, sessiesleutel afspreken, certificaat, versleuteld verder",
    "Client hello, certificaat, versleuteld verder, sessiesleutel afspreken"],a:0,
 w:"Eerst zegt de client welke algoritmen hij kent (<b>client hello</b>), dan bewijst de server wie hij is met zijn <b>certificaat</b>, dan leiden beide partijen een gedeelde <b>sessiesleutel</b> af, en pas daarna gaat het echte verkeer <b>symmetrisch versleuteld</b>. De volgorde is logisch: je spreekt geen sleutel af met iemand van wie je de identiteit nog niet kent."},

{id:"x8b",ch:8,t:"TLS-handshake",g:G.A,mo:1,
 q:"Bij een gewone HTTPS-verbinding: wiens identiteit wordt er vastgesteld?",
 o:["Alleen die van de server, tenzij de client ook een certificaat toont",
    "Alleen die van de client, via het wachtwoord dat hij later invoert",
    "Die van beide partijen, want beide sturen altijd een certificaat",
    "Van geen van beide, want TLS zorgt uitsluitend voor versleuteling"],a:0,
 w:"Standaard is TLS <b>eenzijdig geauthenticeerd</b>: de server bewijst zich met een certificaat, de client niet. Dat de client zich daarna met een wachtwoord aanmeldt, is een aparte laag bovenop TLS. <b>Wederzijdse TLS</b> (mTLS), waarbij ook de client een certificaat toont, bestaat wel maar is uitzondering."},

{id:"x8c",ch:8,t:"SSH",g:G.A,mo:1,
 q:"Waarom is de eerste SSH-verbinding met een nieuwe server het kwetsbaarste moment?",
 o:["Er is nog geen bekende sleutel, dus je kunt niets verifiëren",
    "Er is nog geen sessiesleutel, dus het verkeer gaat onversleuteld",
    "Er is nog geen wachtwoord ingesteld, dus iedereen kan inloggen",
    "Er is nog geen certificaat, dus de CA kan niets bevestigen"],a:0,
 w:"SSH werkt met <b>trust on first use</b>: bij die eerste verbinding heb je niets om de getoonde sleutel mee te vergelijken, dus een man-in-the-middle zou nu zijn eigen sleutel kunnen aanbieden. Daarna staat de sleutel in <code>known_hosts</code> en valt elke wijziging op. Vandaar dat je de fingerprint idealiter <b>out-of-band</b> controleert."},

{id:"x8d",ch:8,t:"Code signing",g:G.I,mo:1,
 q:"Een ondertekende jar is na het tekenen aangepast. Wat merkt jarsigner?",
 o:["De hash van het bestand wijkt af van wat in het manifest staat",
    "De handtekening is verdwenen en het certificaat ontbreekt geheel",
    "De private sleutel van de ondertekenaar blijkt niet meer geldig",
    "Het certificaat is ingetrokken door de uitgevende autoriteit"],a:0,
 w:"MANIFEST.MF bevat een <b>hash per bestand</b>. Verandert er één byte, dan klopt die hash niet meer. Het .SF-bestand hasht op zijn beurt het manifest, en het .RSA-bestand ondertekent het .SF-bestand — een keten waarin elke schakel de vorige vastlegt. Wijzigen zonder de private sleutel kan dus niet onopgemerkt.",
 cf:["8h"]},

{id:"x8e",ch:8,t:"Schijfversleuteling",g:G.V,mo:1,
 q:"Je laptop met versleutelde schijf wordt gestolen terwijl hij ontgrendeld in slaapstand staat. Wat is het risico?",
 o:["De masterkey staat in het geheugen en is mogelijk uit te lezen",
    "De schijf is bij slaapstand automatisch volledig ontsleuteld op disk",
    "Het wachtwoord staat bij slaapstand in leesbare vorm op de schijf",
    "De versleuteling vervalt zodra het apparaat van stroom is geweest"],a:0,
 w:"Schijfversleuteling beschermt data <b>at rest</b>. Zodra je bent ingelogd, staat de <b>masterkey</b> ontsleuteld in het werkgeheugen, want anders kon het systeem niets lezen. Een aanvaller met fysieke toegang tot een draaiend of slapend toestel kan die sleutel mogelijk bemachtigen. Volledig afsluiten is veiliger dan slaapstand.",
 cf:["8k"]},

/* ---- H9 ---- */
{id:"x9a",ch:9,t:"Identificatie",g:G.A,mo:1,
 q:"Je typt je gebruikersnaam in, daarna je wachtwoord, en krijgt vervolgens alleen de map 'Financiën' te zien. Welke drie stappen zijn dat?",
 o:["Identificatie, authenticatie, autorisatie",
    "Authenticatie, identificatie, autorisatie",
    "Identificatie, autorisatie, authenticatie",
    "Authenticatie, autorisatie, identificatie"],a:0,
 w:"<b>Identificatie</b> = de claim (gebruikersnaam). <b>Authenticatie</b> = het bewijs van die claim (wachtwoord). <b>Autorisatie</b> = wat je daarna mag (welke mappen). De volgorde is altijd dezelfde en de drie zijn nooit inwisselbaar — dat is precies waar meerkeuzevragen op mikken."},

{id:"x9b",ch:9,t:"Autorisatie",g:G.B,mo:1,
 q:"Een collega logt succesvol in maar krijgt 'toegang geweigerd' op een rapport. Wat is de juiste conclusie?",
 o:["Authenticatie geslaagd, autorisatie ontoereikend voor dit rapport",
    "Authenticatie mislukt, dus autorisatie kon niet worden beoordeeld",
    "Identificatie geslaagd, maar de authenticatie is halverwege afgebroken",
    "Autorisatie geslaagd, maar de authenticatie geldt niet voor rapporten"],a:0,
 w:"Inloggen lukte, dus <b>identificatie en authenticatie</b> zijn rond: het systeem weet wie zij is en gelooft het. Wat ontbreekt is een <b>recht</b> op dit specifieke object. De fout zit dus in de rechtentoekenning, niet in haar wachtwoord — en de oplossing is een beheerder, geen wachtwoordreset."},

/* ---- H10 ---- */
{id:"x10a",ch:10,t:"Factoren",g:G.A,mo:1,
 q:"Je logt op je telefoon in met een wachtwoord en ontvangt de bevestigingscode via sms op diezelfde telefoon. Wat is het bezwaar?",
 o:["De factoren zijn niet onafhankelijk: één apparaat levert beide",
    "De factoren komen uit dezelfde klasse, namelijk iets dat je weet",
    "Sms is geen erkende factor omdat het geen wachtwoord bevat",
    "De factoren zijn onafhankelijk, maar de code is te kort gekozen"],a:0,
 w:"Het zijn wel degelijk <i>twee klassen</i> — iets dat je weet plus iets dat je hebt. Het probleem is <b>onafhankelijkheid</b>: wie de telefoon in handen heeft of overneemt, heeft beide factoren tegelijk. Echte 2FA vereist dat het compromitteren van de ene factor de andere niet meelevert.",
 cf:["10b"]},

{id:"x10b",ch:10,t:"OTP",g:G.A,mo:1,
 q:"Een TOTP-code wordt geweigerd terwijl de gebruiker hem correct overtypt. Wat is de waarschijnlijkste oorzaak?",
 o:["De klok van het toestel loopt uit de pas met die van de server",
    "De teller van het toestel loopt voor op die van de server",
    "De gedeelde geheime sleutel is na verloop van tijd verlopen",
    "Het toestel heeft geen internetverbinding om de code op te halen"],a:0,
 w:"<b>TOTP</b> = Time-based: beide kanten berekenen de code uit de gedeelde sleutel én de huidige tijd, meestal in blokken van 30 seconden. Loopt de klok van het toestel te ver uit de pas, dan berekent het een code voor een ander tijdvak. Een teller die voorloopt is het <b>HOTP</b>-probleem. En een authenticator-app heeft juist géén internet nodig.",
 cf:["10h","10i"]},

{id:"x10c",ch:10,t:"Challenge-response",g:G.A,mo:1,
 q:"Wat maakt een challenge bij challenge-response bruikbaar?",
 o:["Hij is elke keer anders, zodat een oud antwoord niets oplevert",
    "Hij is elke keer hetzelfde, zodat het antwoord te vergelijken valt",
    "Hij is versleuteld, zodat een afluisteraar hem niet kan lezen",
    "Hij is ondertekend, zodat de client de server kan controleren"],a:0,
 w:"De challenge moet <b>uniek en onvoorspelbaar</b> zijn. Zou hij steeds gelijk zijn, dan kan een afluisteraar het antwoord opvangen en later opnieuw afspelen — een <b>replay-aanval</b>. Doordat het antwoord telkens bij een nieuwe challenge hoort, is afluisteren zinloos, en het geheim zelf gaat nooit over de lijn."},

{id:"x10d",ch:10,t:"SSO",g:G.A,mo:1,
 q:"Wat is het grootste bezwaar tegen single sign-on?",
 o:["Eén gecompromitteerd account geeft toegang tot alle diensten",
    "Elke dienst moet het wachtwoord van de gebruiker apart opslaan",
    "De gebruiker moet bij elke dienst opnieuw twee factoren invoeren",
    "De centrale partij kan de inhoud van alle diensten meelezen"],a:0,
 w:"SSO ruilt gemak in tegen concentratie van risico: de centrale inlog wordt een <i>single point of failure</i>. Daarom hoort juist dáár de sterkste beveiliging te zitten — meerfactor, monitoring, korte sessies. Het voordeel blijft dat de losse diensten je wachtwoord nooit te zien krijgen."},

{id:"x10e",ch:10,t:"SAML",g:G.A,mo:1,
 q:"Bij SAML: wie geeft de ondertekende verklaring af en wie vertrouwt erop?",
 o:["De identity provider geeft af, de service provider vertrouwt erop",
    "De service provider geeft af, de identity provider vertrouwt erop",
    "De gebruiker geeft af, en beide providers vertrouwen daarop",
    "De certificaatautoriteit geeft af, de identity provider vertrouwt"],a:0,
 w:"De <b>identity provider</b> (IdP) kent de gebruiker en stelt zijn identiteit vast; hij ondertekent een <b>assertion</b> met zijn private sleutel. De <b>service provider</b> — de dienst die je wilt gebruiken — controleert die handtekening en laat je binnen zonder je ooit zelf te authenticeren."},

{id:"x10f",ch:10,t:"Wachtwoordsterkte",g:G.A,mo:1,
 q:"Welk beleid levert in de praktijk de sterkste wachtwoorden op?",
 o:["Een minimale lengte eisen en gelekte wachtwoorden blokkeren",
    "Elke maand een verplichte wijziging van het wachtwoord eisen",
    "Minstens één hoofdletter, cijfer en leesteken verplicht stellen",
    "Een maximale lengte instellen zodat typefouten worden beperkt"],a:0,
 w:"<b>Lengte</b> levert meer entropie dan tekensubstituties, en een controle tegen bekende lekken haalt de zwakste keuzes eruit. Gedwongen periodieke wijziging werkt averechts (mensen plakken er een cijfer achter) en complexiteitsregels leveren voorspelbare patronen op — <code>Welkom2024!</code>. Dit is ook het huidige NIST-advies."},

/* ---- H11 ---- */
{id:"x11a",ch:11,t:"OAuth",g:G.A,mo:1,
 q:"Een app wil weten wíe je bent, niet alleen wat zij namens jou mag. Wat heeft zij nodig?",
 o:["OpenID Connect, de identiteitslaag bovenop OAuth 2.0",
    "OAuth 2.0 met een access token dat ruimere rechten geeft",
    "OAuth 2.0 met een refresh token in plaats van een access token",
    "SAML, want OAuth kan niet met identiteiten overweg"],a:0,
 w:"Dit is de klassieke verwarring: <b>OAuth 2.0 is autorisatie</b>, niet authenticatie. Een access token zegt wat er mag, niet wie erachter zit. <b>OpenID Connect</b> legt daar een identiteitslaag overheen met een <b>id_token</b> dat wél over de gebruiker gaat. SAML doet iets vergelijkbaars, maar is niet 'wat OAuth mist'.",
 cf:["11b","11c"]},

{id:"x11b",ch:11,t:"PKCE",g:G.S,mo:1,
 q:"Waarom is PKCE juist bij mobiele apps onmisbaar?",
 o:["Zij kunnen geen client_secret geheimhouden, dus de code moet extra beschermd",
    "Zij kunnen geen HTTPS gebruiken, dus de code gaat onversleuteld over",
    "Zij kunnen geen browser openen, dus de gebruiker geeft anders geen toestemming",
    "Zij kunnen geen tokens bewaren, dus de code moet herbruikbaar blijven"],a:0,
 w:"Een <b>client_secret</b> in een app die op het toestel van de gebruiker staat, is uit te lezen — dus die kan de app niet gebruiken om te bewijzen dat zij het is. <b>PKCE</b> vervangt dat vaste geheim door een geheim dat per keer wordt verzonnen: eerst de hash meesturen, bij het inwisselen het origineel tonen. Onderschept iemand de code, dan mist hij dat origineel.",
 cf:["11h","11i","11j"]},

{id:"x11c",ch:11,t:"OAuth-endpoints",g:G.S,mo:1,
 q:"Waarom gaat de aanvraag bij het token endpoint niet via de browser van de gebruiker?",
 o:["Een direct kanaal tussen app en server is niet af te luisteren via de browser",
    "De browser kan geen POST-verzoeken met tokens in de body versturen",
    "De gebruiker moet bij het token endpoint opnieuw toestemming geven",
    "Het token endpoint staat op een ander domein dan de browser toelaat"],a:0,
 w:"Alles wat via de <b>browser</b> loopt — redirects, adresbalk, geschiedenis, logs van tussenliggende servers — is in principe zichtbaar. Daarom gaat daar alleen de kortlevende, eenmalige <b>authorization code</b> overheen. Het <b>access token</b> zelf haalt de app op via een directe server-naar-server-verbinding.",
 cf:["11e","11f"]},

{id:"x11d",ch:11,t:"OAuth-tokens",g:G.S,mo:1,
 q:"Waarom hebben access tokens meestal een korte geldigheidsduur?",
 o:["Een gestolen token is dan maar korte tijd bruikbaar voor de aanvaller",
    "Een kort token is korter en belast het netwerk daardoor minder zwaar",
    "Een kort token hoeft door de server niet te worden ondertekend",
    "Een kort token kan zonder refresh token worden uitgegeven"],a:0,
 w:"Een access token is een <b>bearer token</b>: wie hem heeft, mag alles wat erin staat — er wordt niet gecontroleerd of jij het bent. Dat maakt de <b>geldigheidsduur</b> de belangrijkste rem op misbruik. Het <b>refresh token</b> vangt het ongemak op: dat blijft langer geldig maar gaat alleen over het beveiligde directe kanaal.",
 cf:["11g"]},

{id:"x11e",ch:11,t:"Toegangsrechten",g:G.B,mo:1,
 q:"Een bestand heeft rechten 640. Wat betekent dat?",
 o:["Eigenaar lezen en schrijven, groep lezen, overigen niets",
    "Eigenaar lezen en schrijven, groep niets, overigen lezen",
    "Eigenaar alle rechten, groep lezen, overigen uitvoeren",
    "Eigenaar lezen, groep schrijven, overigen lezen en schrijven"],a:0,
 w:"Elk cijfer is een optelsom: lezen = 4, schrijven = 2, uitvoeren = 1. Dus 6 = 4+2 (lezen en schrijven), 4 = alleen lezen, 0 = niets. De drie posities zijn achtereenvolgens <b>eigenaar, groep, overigen</b>. Wil je fijnmaziger dan deze drie groepen, dan heb je een <b>ACL</b> nodig.",
 cf:["11a"]},

/* ---- H12 ---- */
{id:"x12a",ch:12,t:"Bronnen",g:G.B,mo:1,

);

/* De dagelijkse oefening put uitsluitend hieruit; de holdout blijft apart.
   Alles wat voortgang toont -- dekkingstabel, doelen, leeches -- rekent ook

const DRILL=CARDS.filter(c=>!c.mo);


const TERMS = [];
TERMS.push(
{ch:1,term:"Platte tekst",def:"Het leesbare, onversleutelde bericht. Encrypten zet platte tekst om in <b>cryptotekst</b>, decrypten weer terug."},
{ch:1,term:"Sleutel",def:"Het geheim waarmee je encrypt of decrypt. Volgens <b>Kerckhoff</b> moet hier de héle veiligheid in zitten — niet in het algoritme."},
{ch:1,term:"Coderen",def:"Data omzetten naar een andere vorm zonder geheim: Base64, ASCII, morse. Iedereen kan het terugdraaien, dus het is géén beveiliging."},
{ch:1,term:"Vertrouwelijkheid",def:"Alleen de bedoelde ontvanger kan het lezen. Krijg je van <b>encryptie</b> — niet van hashen, MAC of ondertekenen."},
{ch:1,term:"Integriteit",def:"Het bericht is onderweg niet gewijzigd. Krijg je van een <b>hash</b>, en tegen opzet van een <b>MAC</b> of <b>handtekening</b>."},
{ch:1,term:"Authenticatie",def:"Vaststellen dat de afzender of gebruiker echt is wie hij beweert. Vereist een gedeeld of asymmetrisch geheim."},
{ch:1,term:"Onweerlegbaarheid",def:"De afzender kan achteraf niet ontkennen dat hij tekende. Alleen bij een <b>digitale handtekening</b>, want alleen hij heeft zijn private sleutel."},

{ch:2,term:"Kerckhoff-principe",def:"Een systeem moet veilig blijven als álles behalve de sleutel bekend is. Daarom worden goede algoritmen openbaar gepubliceerd en getest."},
{ch:2,term:"Security by obscurity",def:"Veiligheid ophangen aan geheimhouding van het ontwerp. Schijnzekerheid — zie de OV-chipkaart (2008), gekraakt zodra het algoritme uitlekte."},
{ch:2,term:"Perfecte geheimhouding",def:"Shannon: de cryptotekst verraadt niets over de platte tekst, zelfs niet met oneindige rekenkracht. Vereist een even lange, eenmalig gebruikte sleutel."},
{ch:2,term:"Sleutellengte",def:"Het aantal bits waaruit de sleutel bestaat. Zegt op zichzelf niets over de veiligheid — vergelijk met <b>sleutelsterkte</b>."},
{ch:2,term:"Sleutelsterkte",def:"Hoeveel werk een aanvaller er echt aan heeft, in bits. 3DES: 168 lengte, 112 sterkte. Verschilt het, dan is er een zwakte gevonden."},
{ch:2,term:"Entropie",def:"De hoeveelheid echte onvoorspelbaarheid, in bits. Vier willekeurige woorden uit 2048 = 44 bits. Lengte zonder willekeur telt niet."},
{ch:2,term:"CSPRNG",def:"Cryptografisch veilige willekeurgenerator, gevoed met echte entropie. Op Linux <code>/dev/random</code> en <code>/dev/urandom</code>. Een gewone rand() is voorspelbaar en dus onbruikbaar."},

{ch:3,term:"Symmetrische encryptie",def:"Eén sleutel voor encrypten én decrypten. Snel en sterk, maar je moet die sleutel wel veilig bij de ander krijgen."},
{ch:3,term:"Sleuteldistributieprobleem",def:"Hoe krijgt de ontvanger de geheime sleutel zonder dat iemand meekijkt? Opgelost met <b>out-of-band</b> uitwisseling of asymmetrische crypto."},
{ch:3,term:"Out-of-band",def:"Via een ander kanaal dan het bericht zelf. Een aanvaller zou beide kanalen tegelijk moeten beheersen. Zie ook 2FA via sms."},

{ch:4,term:"Publieke sleutel",def:"De sleutel die je vrij mag verspreiden. Gebruikt om berichten aan jou te <b>versleutelen</b> en om jouw handtekening te <b>controleren</b>."},
{ch:4,term:"Private sleutel",def:"De sleutel die je nooit afgeeft. Gebruikt om aan jou gerichte berichten te <b>ontsleutelen</b> en om zelf te <b>ondertekenen</b>."},
{ch:4,term:"Trapdoorfunctie",def:"Eén kant op makkelijk, terug praktisch onmogelijk — tenzij je de geheime ingang kent. Bij RSA: priemgetallen vermenigvuldigen versus het product ontbinden."},
{ch:4,term:"Hybride model",def:"Asymmetrisch een <b>sessiesleutel</b> uitwisselen, daarna symmetrisch versleutelen. Zo omzeil je dat asymmetrisch ±1000× trager is. Dit is wat TLS doet."},

{ch:5,term:"Hashfunctie",def:"Zet invoer van elke lengte om in een vaste, korte uitvoer. Eenrichtingsverkeer, en er is <b>geen sleutel</b> bij betrokken."},
{ch:5,term:"Collisie",def:"Twee verschillende invoeren met dezelfde hash. Bestaan altijd (duiventilprincipe); het gaat erom of je er één kunt vínden. Bij MD5 en SHA-1 kan dat."},
{ch:5,term:"Duiventilprincipe",def:"Oneindig veel invoeren, eindig veel hashes — dus botsingen zijn onvermijdelijk. Verklaart waarom collisievrijheid niet bestaat."},
{ch:5,term:"Rainbow table",def:"Vooraf berekende tabel van hash naar wachtwoord. Onbruikbaar te maken met een <b>salt</b>, want die moet de aanvaller per gebruiker opnieuw doorrekenen."},
{ch:5,term:"Salt",def:"Unieke willekeur per gebruiker, toegevoegd vóór het hashen. Hoeft niet geheim te zijn en staat gewoon leesbaar in de database — het werk zit in de uniciteit."},
{ch:5,term:"MAC",def:"Hash mét gedeelde geheime sleutel. Levert <b>integriteit én authenticatie</b>, maar geen onweerlegbaarheid: beide partijen kunnen hem maken."},
{ch:5,term:"HMAC",def:"De gestandaardiseerde manier (RFC 2104) om een MAC uit een hashfunctie te bouwen, met dubbele hashing. Zie <code>HMAC-SHA256</code>."},
{ch:5,term:"Digitale handtekening",def:"De hash van het document, versleuteld met je <b>private sleutel</b>. Levert integriteit, authenticatie én onweerlegbaarheid — maar géén vertrouwelijkheid."},

{ch:6,term:"AES / Rijndael",def:"Symmetrisch blokcijfer, huidige standaard. AES-128 is ruim voldoende — vergelijk met RSA, dat 2048 bits nodig heeft voor vergelijkbare sterkte."},
{ch:6,term:"MD5",def:"Hashfunctie, <b>afgeschreven</b>: er zijn praktisch uitvoerbare collisie-aanvallen. Als download-checksum nog bruikbaar, voor beveiliging niet."},
{ch:6,term:"RSA",def:"Asymmetrisch, voor zowel versleutelen als ondertekenen. RSA-2048 is actueel, RSA-512 triviaal te kraken."},
{ch:6,term:"ECDSA / Curve25519",def:"Asymmetrisch op basis van elliptische krommen. Actueel, en veel kortere sleutels bij dezelfde sterkte. ECDSA is puur voor handtekeningen."},

{ch:7,term:"X.509",def:"Het standaardformaat voor certificaten: publieke sleutel plus identiteit, ondertekend door een CA. Bevat nooit een private sleutel."},
{ch:7,term:"Certificate Authority",def:"Vertrouwde derde die identiteiten controleert en certificaten ondertekent. Al het vertrouwen hangt op de aanname dat de CA zorgvuldig werkt."},
{ch:7,term:"Chain of trust",def:"De keten van handtekeningen van servercertificaat via tussenliggende CA's tot een <b>rootcertificaat</b> dat al in je systeem staat."},
{ch:7,term:"Rootcertificaat",def:"Self-signed, bovenaan de keten. De handtekening bewijst niets; het vertrouwen komt doordat je OS of browser het in de lijst heeft opgenomen."},
{ch:7,term:"PKI",def:"Het geheel van CA's, certificaten en procedures dat publieke sleutels aan identiteiten koppelt — het probleem waar asymmetrische crypto zelf geen antwoord op heeft."},
{ch:7,term:"DV / OV / EV",def:"Hoe streng er gecontroleerd is: alleen domeinbezit, ook de organisatie, of uitgebreid. De <b>encryptie is bij alle drie even sterk</b>."},
{ch:7,term:"CSR",def:"Certificate Signing Request: je publieke sleutel plus gegevens, opgestuurd naar de CA. Je private sleutel gaat nooit mee."},

{ch:8,term:"Sessiesleutel",def:"De symmetrische sleutel die uit de TLS-handshake volgt en waarmee alle verdere data versleuteld wordt. Wordt zelf nooit als zodanig verstuurd."},
{ch:8,term:"known_hosts",def:"Het bestand waarin SSH serversleutels onthoudt. SSH gebruikt geen CA of PKI: je vertrouwt de sleutel de eerste keer zelf (<i>trust on first use</i>)."},
{ch:8,term:"Code signing",def:"Software ondertekenen zodat herkomst en ongewijzigdheid vaststaan. Verifiëren gebeurt in <b>omgekeerde volgorde</b> van het ondertekenen."},
{ch:8,term:"Masterkey",def:"Bij schijfversleuteling: de sleutel waarmee de schijf versleuteld is, die zélf versleuteld wordt met je wachtwoordsleutel. Zo hoef je bij een wachtwoordwijziging niet de hele schijf te herversleutelen."},

{ch:9,term:"Identificatie",def:"Claimen wie je bent (je gebruikersnaam intikken). Nog geen bewijs — dat is <b>authenticatie</b>."},
{ch:9,term:"Autorisatie",def:"Wat een geauthenticeerde gebruiker mag. Komt ná authenticatie. Volgorde: identificatie → authenticatie → autorisatie."},

{ch:10,term:"Authenticatiefactoren",def:"Iets dat je <b>weet</b>, <b>bezit</b> of <b>bent</b>. Voor echte 2FA moeten ze uit verschillende klassen komen én onafhankelijk zijn."},
{ch:10,term:"Challenge-response",def:"De server stuurt iets onvoorspelbaars, jij bewijst dat je het geheim kent zonder het te versturen. Beschermt tegen afluisteren en <b>replay</b>."},
{ch:10,term:"HOTP",def:"OTP op basis van een <b>teller</b> (RFC 4226). De code blijft geldig tot gebruik; server accepteert een klein venster vooruit bij desynchronisatie."},
{ch:10,term:"TOTP",def:"OTP op basis van de <b>tijd</b> (RFC 6238), meestal per 30 seconden. De <i>T</i> van tijd — verloopt vanzelf. Probleem hier is klokdrift, niet tellerdrift."},
{ch:10,term:"Single sign-on",def:"Eén keer authenticeren bij een <b>identity provider</b>, daarmee toegang tot meerdere diensten. Handig, maar ook een single point of failure."},
{ch:10,term:"SAML",def:"XML-formaat waarin een IdP een <b>ondertekende</b> verklaring over je identiteit aan een dienst doorgeeft. Basis van SURFconext, met wayf-scherm."},

{ch:11,term:"ACL",def:"Access Control List: rechten per individuele gebruiker of groep, fijnmaziger dan chmod met alleen eigenaar/groep/rest."},
{ch:11,term:"OAuth 2.0",def:"<b>Autorisatie</b>protocol: een app krijgt namens jou beperkte, intrekbare toegang zonder je wachtwoord. Géén authenticatie — daarvoor is <b>OpenID Connect</b>."},
{ch:11,term:"Authorization code",def:"Kortlevende, eenmalige code (max ±10 min) die via de browser-redirect komt. Wordt via een direct kanaal ingewisseld voor een access token."},
{ch:11,term:"Access token",def:"Sleutel tot de API met een afgebakende <b>scope</b>. Zegt wat er mag, niet wie je bent. Expres kortlevend."},
{ch:11,term:"Refresh token",def:"Waarmee de app stilletjes een nieuw access token ophaalt. Gevoeliger dan het access token zelf, dus alleen voor vertrouwde back-ends."},
{ch:11,term:"PKCE",def:"RFC 7636: de app stuurt de SHA-256 van een zelfverzonnen <b>code_verifier</b> mee en bewijst bij het inwisselen dat hij het origineel heeft. Maakt een onderschepte authorization code waardeloos."}
);

/* ============ 3. VOORTGANG ============ */
const KEY="sec-oefenapp-v1";
const LADDER=[0,1,1,2,3,4,6];
let S=load();

function blank(){return{cards:{},log:[],mocks:[],streak:[],made:todayISO(),theme:null};}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return blank();
  return Object.assign(blank(),JSON.parse(raw));}catch(e){return blank();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function cs(id){if(!S.cards[id])S.cards[id]={box:0,due:0,reps:0,hce:0,sure:0,leech:false,last:null};
  return S.cards[id];}

/* Vier uitkomsten uit (goed?) x (zeker?). Dit onderscheid is de kern:
   een kennisgat repareer je met herhaling, een misvatting alleen met contrast. */
function grade(card,correct,sure,ms){
  const c=cs(card.id); c.reps++;
  c.last = correct?(sure?"CS":"CG"):(sure?"WS":"WG");
  const slow = ms>20000;
  if(correct&&sure){ if(!slow)c.box=Math.min(LADDER.length-1,c.box+1); c.sure++; }
  else if(correct){ c.sure=0; }                       /* geraden is geen kennis */
  else if(!sure){ c.box=Math.max(1,c.box-2); c.sure=0; }
  else { c.box=0; c.hce++; c.sure=0; if(c.hce>=4)c.leech=true; }

  /* Deadline-compressie: het interval mag nooit langer zijn dan de tijd die nodig
     is om de kaart nog het vereiste aantal keer terug te zien. */
  const need = c.hce>0?4:3;
  const maxIv = Math.floor(studyDaysLeft()/need);
  c.due = dayIndex() + Math.min(LADDER[c.box],Math.max(0,maxIv));

  S.log.push({id:card.id,d:todayISO(),r:c.last,ms:Math.round(ms/100)});
  if(S.log.length>4000)S.log=S.log.slice(-3000);
  const t=todayISO(); if(S.streak[S.streak.length-1]!==t)S.streak.push(t);
  save(); return c;
}

/* ============ 4. SESSIE ============ */
function pools(){
  const di=dayIndex(), mis=[],due=[],fresh=[],seen=[];
  for(const card of DRILL){
    const c=S.cards[card.id];
    if(!c){fresh.push(card);continue;}
    if(c.leech)continue;
    if(c.hce>0&&c.due<=di)mis.push(card);
    else if(c.due<=di)due.push(card);
    else seen.push(card);
  }
  return {mis,due,fresh,seen};
}
function pick(arr,n){const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,n);}

/* Nooit twee kaarten van hetzelfde onderwerp of hetzelfde doel achter elkaar --
   anders wordt het patroonherkenning in plaats van categoriseren. */
function interleave(list){
  const out=[],rest=list.slice();
  while(rest.length){
    let idx=rest.findIndex(c=>!out.length||
      (c.t!==out[out.length-1].t&&c.g!==out[out.length-1].g));
    if(idx<0)idx=0;
    out.push(rest.splice(idx,1)[0]);
  }
  return out;
}
function buildSession(size,chapter){
  let list;
  if(chapter){ list=pick(DRILL.filter(c=>c.ch===chapter),size); }
  else{
    const p=pools();
    let out=pick(p.mis,Math.round(size*0.40))
      .concat(pick(p.due,Math.round(size*0.35)))
      .concat(pick(p.fresh,Math.round(size*0.15)));
    const used=new Set(out.map(c=>c.id));
    list=out.concat(pick(p.due.concat(p.fresh,p.seen).filter(c=>!used.has(c.id)),
      Math.max(0,size-out.length)));
  }
  return interleave(list);
}

/* ---- Sessie ---- */
let sess=null;
function startSession(list,label){
  if(!list.length){go("vandaag");return;}
  /* Bovengrens op de sessie: misvattingen mogen kaarten toevoegen, maar een
     sessie van een kwartier mag niet ongemerkt een uur worden. */
  sess={list,i:0,label,right:0,sure:0,t0:0,answers:[],
        max:Math.round(list.length*1.5)+3,req:{}};
  drawCard();
}
function shuffledOrder(n){
  const o=[];for(let i=0;i<n;i++)o.push(i);
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}
  return o;
}
function drawCard(){
  if(sess.i>=sess.list.length)return endSession();
  const card=sess.list[sess.i];
  setRail(sess.i/sess.list.length*100);
  window.scrollTo(0,0);
  const order=shuffledOrder(card.o.length);

  view.innerHTML="";
  const wrap=el("<div></div>");
  wrap.appendChild(el('<div class="qhead"><span class="tag">H'+card.ch+"</span>"+
    '<span class="tag">'+esc(card.t)+"</span>"+
    '<span class="tag goal">'+esc(card.g)+"</span>"+
    '<span class="spacer"></span><span class="tag num">'+(sess.i+1)+" / "+sess.list.length+"</span></div>"));
  wrap.appendChild(el('<p class="qtext">'+card.q+"</p>"));

  const opts=el('<div class="opts"></div>');
  const btns=[]; let chosen=-1;
  order.forEach((oi,n)=>{
    const b=el('<button class="opt" type="button" aria-pressed="false"><span class="ltr">'+
      "ABCD"[n]+'</span><span>'+card.o[oi]+"</span></button>");
    b.dataset.oi=oi;
    b.onclick=()=>{
      chosen=oi;
      btns.forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
      confBox.style.display="";
      confBox.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
    btns.push(b); opts.appendChild(b);
  });
  wrap.appendChild(opts);

  const confBox=el('<div class="conf" style="display:none"><p>Hoe zeker ben je van dit antwoord?</p>'+
    '<div class="row"><button class="btn" data-s="1">Zeker weten</button>'+
    '<button class="btn ghost" data-s="0">Gokje</button></div></div>');
  confBox.querySelectorAll("button").forEach(b=>{
    b.onclick=()=>reveal(card,chosen,b.dataset.s==="1",btns,wrap,confBox);
  });
  wrap.appendChild(confBox);
  view.appendChild(wrap);
  sess.t0=Date.now();
}

function reveal(card,chosen,sure,btns,wrap,confBox){
  const ms=Date.now()-sess.t0;
  const correct=chosen===card.a;
  grade(card,correct,sure,ms);
  sess.answers.push({id:card.id,correct,sure});
  if(correct)sess.right++;
  if(correct&&sure)sess.sure++;

  btns.forEach(b=>{
    const oi=+b.dataset.oi; b.disabled=true; b.setAttribute("aria-pressed","false");
    if(oi===card.a)b.classList.add("right");
    else if(oi===chosen)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  confBox.remove();

  const slow=ms>20000;
  const head = (correct&&sure)?["ok","Goed — en je wist het"]
    : correct?["ok","Goed, maar je gokte"]
    : sure?["bad","Fout — en je was zeker"]
    : ["bad","Fout, maar je gokte al"];

  const fb=el("<div></div>");
  fb.appendChild(el('<div class="verdict '+head[0]+'">'+head[1]+"</div>"));
  fb.appendChild(el('<p class="why">'+card.w+"</p>"));

  if(!correct&&sure)
    fb.appendChild(el('<p class="note warn">Deze komt zo terug, met de begrippen ernaast waar je hem mee verwart.</p>'));
  else if(correct&&!sure)
    fb.appendChild(el('<p class="note">Goed geraden telt niet als kennis — je ziet hem net zo vaak terug.</p>'));
  else if(correct&&sure&&slow)
    fb.appendChild(el('<p class="note">Je had er lang voor nodig, dus nog geen promotie.</p>'));

  const next=el('<div class="row" style="margin-top:20px"><button class="btn">Volgende</button></div>');
  next.querySelector("button").onclick=()=>{
    if(!correct&&sure&&sess.list.length<sess.max&&!sess.req[card.id]){
      sess.req[card.id]=1;
      sess.list.splice(Math.min(sess.list.length,sess.i+8),0,card);
      /* de verwarbare tegenhangers erbij, met afstand ertussen: naast elkaar
         zetten leert patroonherkenning, op afstand leert categoriseren */
      if(card.cf)card.cf.forEach((cid,k)=>{
        if(sess.list.length>=sess.max)return;
        const c2=CARDS.find(c=>c.id===cid);
        if(c2&&!sess.list.slice(sess.i).some(x=>x.id===cid))
          sess.list.splice(Math.min(sess.list.length,sess.i+3+k*4),0,c2);
      });
    }
    sess.i++; drawCard();
  };
  fb.appendChild(next);
  wrap.appendChild(fb);
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function endSession(){
  setRail(100);
  const n=sess.answers.length;
  const pct=Math.round(sess.right/n*100);
  const guessedRight=sess.answers.filter(a=>a.correct&&!a.sure).length;
  const sureWrong=sess.answers.filter(a=>!a.correct&&a.sure).length;

  view.innerHTML="";
  view.appendChild(el("<div><h1>"+esc(sess.label)+" afgerond</h1>"+
    '<p class="lede">'+sess.right+" van "+n+" goed.</p>"+
    '<div class="grid">'+
      '<div class="stat"><div class="k">Score</div><div class="v">'+pct+"<small>%</small></div></div>"+
      '<div class="stat"><div class="k">Goed én zeker</div><div class="v">'+sess.sure+"</div></div>"+
      '<div class="stat"><div class="k">Fout maar zeker</div><div class="v">'+sureWrong+"</div></div>"+
      '<div class="stat"><div class="k">Goed gegokt</div><div class="v">'+guessedRight+"</div></div>"+
    "</div></div>"));

  const msg = sureWrong>0
    ? "Die "+sureWrong+" fout-maar-zekere "+(sureWrong===1?"kaart is":"kaarten zijn")+
      " je grootste winstpunt. Op een meerkeuzetoets zijn de afleiders precies échte begrippen in het verkeerde vakje — daar verlies je punten, niet op wat je niet weet."
    : guessedRight>2
    ? "Veel goed gegokt. Die kennis zit nog niet vast; de motor houdt ze daarom in de roulatie."
    : "Schone sessie. Zo hoort het eruit te zien.";
  view.appendChild(el('<p class="why" style="margin-top:18px">'+msg+"</p>"));

  const row=el('<div class="row" style="margin-top:20px"><button class="btn">Nog een sessie</button>'+
    '<button class="btn ghost">Terug</button></div>');
  row.children[0].onclick=()=>startSession(buildSession(20,null),"Sessie");
  row.children[1].onclick=()=>go("vandaag");
  view.appendChild(row);
  sess=null;
}

  const holder=el('<div class="card" style="padding:16px"></div>');

  const body=tbl.querySelector("tbody");
  for(let ch=1;ch<=12;ch++){
    const set=DRILL.filter(c=>c.ch===ch);
    if(!set.length)continue;
    const st=set.map(c=>S.cards[c.id]);
    const nNew=st.filter(c=>!c).length;
    const nMid=st.filter(c=>c&&c.box<4).length;
    const nGood=st.filter(c=>c&&c.box>=4).length;
    const tot=set.length;
    const tr=el("<tr><td>"+ch+"</td><td><b>"+CH_NAMES[ch]+"</b></td>"+
      '<td class="num">'+tot+"</td>"+
      '<td><div class="meter"><i class="m2" style="width:'+(nGood/tot*100)+'%"></i>'+
      '<i class="m1" style="width:'+(nMid/tot*100)+'%"></i>'+
      '<i class="m0" style="width:'+(nNew/tot*100)+'%"></i></div></td></tr>');
    tr.style.cursor="pointer";
    tr.onclick=()=>startSession(buildSession(Math.min(set.length,20),ch),"H"+ch+" · "+CH_NAMES[ch]);
    body.appendChild(tr);
  }
  holder.appendChild(tbl);
  view.appendChild(holder);
  view.appendChild(el('<p class="note">Tik op een hoofdstuk om er direct mee te oefenen.</p>'));
}

function vTerms(){flashSet=pick(TERMS,TERMS.length);flashIdx=0;drawFlash();}
function drawFlash(){
  if(!flashSet.length){view.innerHTML='<div class="empty">Geen begrippen geladen.</div>';return;}
  const t=flashSet[flashIdx%flashSet.length];
  setRail((flashIdx%flashSet.length)/flashSet.length*100);

  view.appendChild(el("<div><h1>Begrippen</h1>"+

const ANIMS=[];
/* Eén stroomdiagram-renderer voor alle processen: twee partijen, berichten
   ertussen, en de huidige stap opgelicht. Kleur codeert de sleutel:
   blauw = publiek, pruim = privé -- nooit rood/groen, want die betekenen
   in deze app al goed en fout. */
function flowSVG(L,R,msgs,step){
  const H=86+msgs.length*40;
  const xl=88,xr=472;
  let s='<svg viewBox="0 0 560 '+H+'" width="560" style="max-width:100%;height:auto" role="img">';
  s+='<text x="'+xl+'" y="22" class="nm" text-anchor="middle">'+L+"</text>";
  s+='<text x="'+xr+'" y="22" class="nm" text-anchor="middle">'+R+"</text>";
  s+='<line x1="'+xl+'" y1="34" x2="'+xl+'" y2="'+(H-14)+'" stroke="var(--line)" stroke-width="2"/>';
  s+='<line x1="'+xr+'" y1="34" x2="'+xr+'" y2="'+(H-14)+'" stroke="var(--line)" stroke-width="2"/>';

  msgs.forEach((m,i)=>{
    const y=72+i*40;
    const on=i===step, past=i<step;
    const col = on ? (m.c||"var(--accent)") : past ? "var(--muted)" : "var(--line)";
    const op  = on ? 1 : past ? .55 : .3;
    s+='<g opacity="'+op+'">';
    if(m.d===0){                                   /* interne stap, geen bericht */
      const x = m.side==="R" ? xr : xl;
      s+='<rect x="'+(x-64)+'" y="'+(y-13)+'" width="128" height="26" rx="6" fill="none" stroke="'+col+
         '" stroke-width="2" stroke-dasharray="4 3"/>';
      s+='<text x="'+x+'" y="'+(y+4)+'" class="lbl" fill="'+col+'" text-anchor="middle">'+m.t+"</text>";
    } else {
      const x1 = m.d>0?xl:xr, x2 = m.d>0?xr:xl;
      s+='<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+col+'" stroke-width="2"'+
         (m.d===2?' stroke-dasharray="6 4"':"")+"/>";
      const tp = m.d>0?xr:xl, dx = m.d>0?-9:9;
      s+='<polygon points="'+tp+','+y+' '+(tp+dx)+','+(y-5)+' '+(tp+dx)+','+(y+5)+'" fill="'+col+'"/>';
      if(m.d===2)
        s+='<polygon points="'+x1+','+y+' '+(x1-dx)+','+(y-5)+' '+(x1-dx)+','+(y+5)+'" fill="'+col+'"/>';
      s+='<text x="280" y="'+(y-9)+'" class="lbl" fill="'+col+'" text-anchor="middle">'+m.t+"</text>";
    }
    s+="</g>";
  });
  return s+"</svg>";
}

/* Verticale keten voor de chain of trust. */
function chainSVG(nodes,step){
  const H=40+nodes.length*76;
  let s='<svg viewBox="0 0 560 '+H+'" width="560" style="max-width:100%;height:auto" role="img">';
  nodes.forEach((n,i)=>{
    const y=24+i*76, on=i===step, past=i<step;
    const col = on?"var(--accent)":past?"var(--muted)":"var(--line)";
    s+='<g opacity="'+(on?1:past?.6:.32)+'">';
    s+='<rect x="130" y="'+y+'" width="300" height="52" rx="8" fill="none" stroke="'+col+'" stroke-width="2"/>';
    s+='<text x="280" y="'+(y+22)+'" class="nm" fill="'+col+'" text-anchor="middle">'+n.t+"</text>";
    s+='<text x="280" y="'+(y+40)+'" class="lbl" fill="'+col+'" text-anchor="middle">'+n.s+"</text>";
    if(i<nodes.length-1){
      s+='<line x1="280" y1="'+(y+52)+'" x2="280" y2="'+(y+70)+'" stroke="'+col+'" stroke-width="2"/>';
      s+='<polygon points="280,'+(y+76)+' 275,'+(y+66)+' 285,'+(y+66)+'" fill="'+col+'"/>';
      s+='<text x="296" y="'+(y+68)+'" class="lbl" fill="'+col+'">ondertekent</text>';
    }
    s+="</g>";
  });
  return s+"</svg>";
}

function drawAnim(ai,step){
  const a=ANIMS[ai];
  setRail((step+1)/a.steps.length*100);
  view.innerHTML="";
  window.scrollTo(0,0);
  const s=a.steps[step];
  const wrap=el("<div></div>");
  wrap.appendChild(el('<div class="qhead"><span class="tag">H'+a.ch+"</span>"+
    '<span class="tag">'+esc(a.title)+'</span><span class="spacer"></span>'+
    '<span class="tag num">'+(step+1)+" / "+a.steps.length+"</span></div>"));
  wrap.appendChild(el('<div class="card scroller">'+a.svg(step)+"</div>"));
  wrap.appendChild(el('<h2 style="margin-bottom:8px">Stap '+(step+1)+"</h2>"));
  wrap.appendChild(el('<p class="qtext" style="margin-bottom:12px">'+s.h+"</p>"));
  wrap.appendChild(el('<p class="why">'+s.d+"</p>"));

  const row=el('<div class="row" style="margin-top:20px"></div>');
  if(step>0){const b=el('<button class="btn ghost">Terug</button>');
    b.onclick=()=>drawAnim(ai,step-1);row.appendChild(b);}
  if(step<a.steps.length-1){const b=el('<button class="btn" style="flex:1">Volgende stap</button>');
    b.onclick=()=>drawAnim(ai,step+1);row.appendChild(b);}
  else{const b=el('<button class="btn" style="flex:1">Klaar</button>');
    b.onclick=()=>go("processen");row.appendChild(b);}
  wrap.appendChild(row);
  view.appendChild(wrap);
}

/* ---- Mock exam ---- */
let mock=null;
/* Het echte tentamen telt 60 vragen en de cesuur ligt op 60% goed.
   Het cijfer is gokgecorrigeerd: bij vier opties levert puur gokken al
   vijftien goede antwoorden op, en die tellen niet als kennis. De schaal
   loopt lineair van 1,0 bij de gokscore, via 5,5 op de cesuur, naar 10. */
const MOCK_N=60;
const HOLDHALF={}; CARDS.filter(c=>c.mo).forEach((c,i)=>{HOLDHALF[c.id]=i%2;});
function cesFrac(){return S.ces||0.60;}
function cesuur(n){return Math.ceil(n*cesFrac());}
function mockGrade(right,n){
  const gok=n/4, ces=cesuur(n);
  if(right<=gok)return 1;
  if(right<ces)return Math.round((1+4.5*(right-gok)/(ces-gok))*10)/10;
  return Math.round((5.5+4.5*(right-ces)/(n-ces))*10)/10;
}
function mmss(ms){const s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

function vMock(){
  view.innerHTML="";
  const ces=cesuur(MOCK_N);
  view.appendChild(el("<div><h1>Mock exam</h1>"+
    '<p class="lede">Zestig vragen, geen feedback tussendoor, precies zoals Remindo. '+
    'Geslaagd vanaf <b>'+ces+" van de "+MOCK_N+"</b> goed.</p></div>"));

  const prev=S.mocks.slice(-4).reverse();
  if(prev.length){
    const g=el('<div class="grid" style="margin-bottom:8px"></div>');
    prev.forEach(m=>{
      const leesbaar=!!m.a;
      const t=el("<"+(leesbaar?"button":"div")+' class="stat" style="text-align:left;width:100%'+
        (leesbaar?";border-color:var(--accent)":"")+'"><div class="k">'+
        m.d.slice(8,10)+"-"+m.d.slice(5,7)+'</div><div class="v">'+m.grade.toFixed(1)+
        '</div><div class="k" style="margin-top:4px">'+m.right+" / "+m.n+
        (leesbaar?" \u00b7 nalezen":"")+"</div></"+(leesbaar?"button":"div")+">");
      if(leesbaar)t.onclick=()=>showPastMock(m);
      g.appendChild(t);
    });
    view.appendChild(g);
    if(prev.some(m=>m.a))
      view.appendChild(el('<p class="note" style="margin:0 0 18px">Tik op een uitslag om '+
        'terug te lezen wat je per vraag invulde.</p>'));
  }

  const b=el('<div class="card"><h2 style="margin-top:0">Klaar?</h2>'+
    '<p style="margin:0 0 14px">Doe hem zoals de echte: telefoon weg, dictaat dicht, '+
    'in één keer uitzitten. De klok loopt mee zodat je je tempo leert kennen.</p>'+
    '<p class="note" style="margin:0 0 16px">Ongeveer een derde van de vragen komt uit een '+
    'aparte voorraad die nooit in je dagelijkse oefening zit, en die voorraad wisselt per '+
    'afname. Zonder dat zou de mock je herkenning meten in plaats van je kennis \u2014 en '+
    'juist daarom scoor je hier waarschijnlijk nog iets hoger dan op het echte tentamen.</p>'+
    '<label class="note" style="display:block;margin:0 0 14px">Cesuur '+
    '<select style="font:inherit;padding:4px 6px;margin-left:6px">'+
    '<option value="0.55">55% goed</option><option value="0.6">60% goed</option>'+
    '<option value="0.65">65% goed</option></select></label>'+
    '<button class="btn">Start mock exam</button></div>');
  const sel=b.querySelector("select");
  sel.value=String(cesFrac());
  sel.onchange=()=>{S.ces=parseFloat(sel.value);save();vMock();};
  b.querySelector("button").onclick=startMock;
  view.appendChild(b);
}
function startMock(){
  const n=MOCK_N, half=S.mocks.length%2;
  /* De holdout is in twee helften gesplitst en de mocks wisselen elkaar af.
     De helft die niet aan de beurt is blijft in reserve -- die komt pas in
     beeld als de rest op zou zijn. Zo krijgt elke mock ongeveer evenveel
     verse vragen, en blijven opeenvolgende uitslagen onderling vergelijkbaar
     in plaats van dat de eerste alles opmaakt. */
  const tier=c=>c.mo?(HOLDHALF[c.id]===half?0:2):1;
  const out=[];
  for(let ch=1;ch<=12;ch++){
    const all=CARDS.filter(c=>c.ch===ch);
    if(!all.length)continue;
    const want=Math.max(1,Math.round(all.length/CARDS.length*n));
    const t=[[],[],[]]; all.forEach(c=>t[tier(c)].push(c));
    let got=[];
    t.forEach(g=>{if(got.length<want)got=got.concat(pick(g,want-got.length));});
    out.push(...got);
  }
  let list=pick(out,n);
  if(list.length<n){
    const used=new Set(list.map(c=>c.id));
    list=list.concat(pick(CARDS.filter(c=>!used.has(c.id)),n-list.length));
  }
  mock={list:interleave(list),i:0,answers:[],t0:Date.now(),tick:null};
  mock.tick=setInterval(()=>{
    const k=document.getElementById("mclock");
    if(!k){clearInterval(mock.tick);return;}
    k.textContent=mmss(Date.now()-mock.t0);
  },1000);
  drawMockCard();
}
/* Reconstrueer de antwoorden van een bewaarde mock uit de kaartenbank. */
function answersOf(m){
  if(!m.a)return null;
  return m.a.map(x=>{const c=CARDS.find(y=>y.id===x.i);
    return c?{card:c,chosen:x.c,correct:x.c===c.a}:null;}).filter(Boolean);
}
/* Standaard alleen de fouten -- daar zit het leren -- maar alles is op te
   vragen, want een goed antwoord dat eigenlijk een gok was telt ook. */
function mockReview(answers){
  const box=el("<div></div>"), wrong=answers.filter(a=>!a.correct);
  box.appendChild(el("<h2>Je antwoorden</h2>"));
  const tabs=el('<div class="row" style="margin-bottom:14px">'+
    '<button class="btn ghost" style="flex:1">Alleen fout \u00b7 '+wrong.length+"</button>"+
    '<button class="btn ghost" style="flex:1">Alles \u00b7 '+answers.length+"</button></div>");
  const list=el('<div class="stack"></div>');
  const mark=k=>[...tabs.children].forEach((b,j)=>{b.className="btn"+(j===k?"":" ghost");});
  const draw=onlyWrong=>{
    list.innerHTML="";
    const set=onlyWrong?wrong:answers;
    if(!set.length){
      list.appendChild(el('<p class="note">Niets fout. Loop dan de vragen na waar je twijfelde \u2014 '+
        'een goede gok is nog geen kennis.</p>'));
      return;
    }
    set.forEach(a=>{
      const c=a.card, nr=answers.indexOf(a)+1, kleur=a.correct?"ok":"bad";
      const item=el('<div class="card"></div>');
      item.appendChild(el('<div class="qhead"><span class="tag num">'+nr+"</span>"+
        '<span class="tag">H'+c.ch+'</span><span class="tag goal">'+esc(c.g)+"</span>"+
        '<span class="spacer"></span><span class="tag" style="color:var(--'+kleur+
        ');border-color:var(--'+kleur+')">'+(a.correct?"goed":"fout")+"</span></div>"));
      item.appendChild(el('<p style="margin:0 0 12px;font-weight:550">'+esc(c.q)+"</p>"));
      const opts=el('<div class="opts" style="margin-bottom:14px"></div>');
      c.o.forEach((txt,k)=>{
        const mijn=k===a.chosen, juist=k===c.a;
        const cls=juist?"opt right":(mijn?"opt wrong":"opt dim");
        opts.appendChild(el('<div class="'+cls+'"><span class="ltr">'+
          (juist?"\u2713":(mijn?"\u2717":"&nbsp;"))+"</span><span>"+esc(txt)+
          (mijn?' <span class="tag" style="margin-left:6px">jouw antwoord</span>':"")+
          "</span></div>"));
      });
      item.appendChild(opts);
      item.appendChild(el('<p class="why">'+c.w+"</p>"));
      list.appendChild(item);
    });
  };
  tabs.children[0].onclick=()=>{draw(true);mark(0);};
  tabs.children[1].onclick=()=>{draw(false);mark(1);};
  box.appendChild(tabs); box.appendChild(list);
  draw(true); mark(0);
  return box;
}
/* Een eerdere mock opnieuw openen vanaf het overzicht. */
function showPastMock(m){
  const answers=answersOf(m);
  if(!answers)return;
  view.innerHTML=""; setRail(100);
  view.appendChild(el("<div><h1>Mock van "+m.d.slice(8,10)+"-"+m.d.slice(5,7)+"</h1>"+
    '<p class="lede">'+m.right+" van de "+m.n+" goed \u2014 cijfer "+m.grade.toFixed(1)+", "+
    (m.pass?"gehaald":"niet gehaald")+".</p></div>"));
  view.appendChild(mockReview(answers));
  const wrong=answers.filter(a=>!a.correct).map(a=>a.card);
  const row=el('<div class="row" style="margin-top:22px">'+
    '<button class="btn">Deze fouten oefenen</button>'+
    '<button class="btn ghost">Terug</button></div>');
  row.children[0].onclick=()=>startSession(interleave(wrong),"Fouten uit de mock");
  if(!wrong.length)row.children[0].disabled=true;
  row.children[1].onclick=()=>go("mock");
  view.appendChild(row);
}
function drawMockCard(){
  if(mock.i>=mock.list.length)return endMock();
  const card=mock.list[mock.i];
  setRail(mock.i/mock.list.length*100);
  window.scrollTo(0,0);
  const order=shuffledOrder(card.o.length);
  view.innerHTML="";
  const wrap=el("<div></div>");
  wrap.appendChild(el('<div class="qhead"><span class="tag">Mock</span>'+
    '<span class="tag num" id="mclock">'+mmss(Date.now()-mock.t0)+'</span>'+
    '<span class="spacer"></span>'+
    '<span class="tag num">'+(mock.i+1)+" / "+mock.list.length+"</span></div>"));
  wrap.appendChild(el('<p class="qtext">'+card.q+"</p>"));
  const opts=el('<div class="opts"></div>');
  order.forEach((oi,n)=>{
    const b=el('<button class="opt" type="button"><span class="ltr">'+"ABCD"[n]+
      '</span><span>'+card.o[oi]+"</span></button>");
    b.onclick=()=>{mock.answers.push({card,chosen:oi,correct:oi===card.a});mock.i++;drawMockCard();};
    opts.appendChild(b);
  });
  wrap.appendChild(opts);
  view.appendChild(wrap);
}
function endMock(){
  setRail(100);
  if(mock.tick)clearInterval(mock.tick);
  const right=mock.answers.filter(a=>a.correct).length;
  const n=mock.answers.length;
  const secs=Math.round((Date.now()-mock.t0)/1000);
  const ces=cesuur(n), grade=mockGrade(right,n), pass=right>=ces;
  /* Bewaar wat zij per vraag aankruiste, niet alleen de score. Alleen het
     kaart-id en de gekozen index -- de vraag zelf staat al in de bank. */
  const filled=mock.answers.map(a=>({i:a.card.id,c:a.chosen}));
  S.mocks.push({d:todayISO(),right,n,grade,pass,secs,a:filled});save();

  view.innerHTML="";
  view.appendChild(el('<div><h1>Mock afgerond</h1>'+
    '<p class="lede" style="color:var(--'+(pass?"ok":"bad")+');font-weight:600">'+
    (pass?"Gehaald":"Niet gehaald")+" \u2014 "+right+" van de "+n+
    " goed, de cesuur ligt op "+ces+'.</p><div class="grid">'+
    '<div class="stat"><div class="k">Cijfer</div><div class="v">'+grade.toFixed(1)+"</div></div>"+
    '<div class="stat"><div class="k">Goed</div><div class="v">'+right+' <small>/ '+n+"</small></div></div>"+
    '<div class="stat"><div class="k">Tijd</div><div class="v">'+Math.round(secs/60)+
    ' <small>min</small></div></div>'+
    '<div class="stat"><div class="k">Per vraag</div><div class="v">'+Math.round(secs/n)+
    ' <small>sec</small></div></div>'+
    '</div><p class="note">Het cijfer is gokgecorrigeerd: bij vier opties levert puur gokken al '+
    Math.round(n/4)+' goede antwoorden op, dus die tellen niet als kennis. '+
    'De schaal loopt van 1,0 bij '+Math.round(n/4)+' goed, via 5,5 op de cesuur van '+ces+
    ', naar 10 bij alles goed. Voor een 8 heb je '+
    Math.ceil(ces+(8-5.5)*(n-ces)/4.5)+' van de '+n+' nodig.</p></div>'));

  const answers=mock.answers, wrong=answers.filter(a=>!a.correct);
  view.appendChild(mockReview(answers));
  const row=el('<div class="row" style="margin-top:22px"><button class="btn">Fouten nu oefenen</button>'+
    '<button class="btn ghost">Terug</button></div>');
  row.children[0].onclick=()=>startSession(interleave(wrong.map(a=>a.card)),"Fouten uit de mock");
  row.children[1].onclick=()=>go("vandaag");
  if(!wrong.length)row.children[0].disabled=true;
  view.appendChild(row);
  mock=null;
}

/* ---- Voortgang ---- */
function vProgress(){
  view.innerHTML="";
  const st=Object.values(S.cards);
  const good=st.filter(c=>c.box>=4).length;
  const mis=st.filter(c=>c.hce>0).length;
  const total=CARDS.length||1;
  const days=new Set(S.streak).size;

  view.appendChild(el("<div><h1>Voortgang</h1>"+
    '<p class="lede">Nog <b class="num">'+daysLeftCalendar()+"</b> dagen tot de toets.</p>"+
    '<div class="grid">'+
      '<div class="stat"><div class="k">Beheerst</div><div class="v">'+Math.round(good/total*100)+"<small>%</small></div></div>"+
      '<div class="stat"><div class="k">Kaarten gezien</div><div class="v">'+st.length+" <small>/ "+CARDS.length+"</small></div></div>"+
      '<div class="stat"><div class="k">Misvattingen</div><div class="v">'+mis+"</div></div>"+
      '<div class="stat"><div class="k">Dagen geoefend</div><div class="v">'+days+"</div></div>"+
    "</div></div>"));

  view.appendChild(el("<h2>Per beveiligingsdoel</h2>"));
  const holder=el('<div class="card" style="padding:16px"></div>');
  const tbl=el('<table class="cov"><tbody></tbody></table>');
  Object.values(G).forEach(g=>{
    const set=DRILL.filter(c=>c.g===g);
    if(!set.length)return;
    const s=set.map(c=>S.cards[c.id]);
    const nGood=s.filter(c=>c&&c.box>=4).length;
    const nMid=s.filter(c=>c&&c.box<4).length;
    const nNew=s.filter(c=>!c).length;
    tbl.querySelector("tbody").appendChild(el('<tr><td colspan="2"><b>'+g+"</b></td>"+
      '<td class="num">'+set.length+"</td>"+
      '<td><div class="meter"><i class="m2" style="width:'+(nGood/set.length*100)+'%"></i>'+
      '<i class="m1" style="width:'+(nMid/set.length*100)+'%"></i>'+
      '<i class="m0" style="width:'+(nNew/set.length*100)+'%"></i></div></td></tr>'));
  });
  holder.appendChild(tbl);
  view.appendChild(holder);

  view.appendChild(el("<h2>Back-up</h2>"));
  const bu=el('<div class="card"><p style="margin:0 0 14px">Je voortgang staat in deze browser. Wis je je browsergegevens, dan is hij weg — maak dus af en toe een kopie.</p>'+
    '<div class="row"><button class="btn ghost" id="exp">Kopieer voortgang</button>'+
    '<button class="btn ghost" id="imp">Plak voortgang</button>'+
    '<button class="btn ghost" id="rst" style="color:var(--bad)">Wis alles</button></div>'+
    '<p class="note" id="msg"></p></div>');
  bu.querySelector("#exp").onclick=()=>{
    const txt=JSON.stringify(S);
    navigator.clipboard.writeText(txt).then(
      ()=>bu.querySelector("#msg").textContent="Gekopieerd. Plak hem ergens veilig.",
      ()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.width="100%";
        ta.rows=4;bu.appendChild(ta);ta.select();});
  };
  bu.querySelector("#imp").onclick=()=>{
    const v=prompt("Plak hier je gekopieerde voortgang:");
    if(!v)return;
    try{S=Object.assign(blank(),JSON.parse(v));save();go("voortgang");}
    catch(e){bu.querySelector("#msg").textContent="Dat was geen geldige voortgang.";}
  };
  bu.querySelector("#rst").onclick=()=>{
    if(confirm("Alles wissen? Dit kan niet ongedaan worden gemaakt.")){S=blank();save();go("vandaag");}
  };
  view.appendChild(bu);
}

/* ============ 6. START ============ */
document.getElementById("countdown").textContent=daysLeftCalendar()+" dagen tot de toets";
const themeBtn=document.getElementById("themeBtn");
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
themeBtn.onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?"dark"
    :(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
  S.theme=next;save();
};
go("vandaag");
</script>
